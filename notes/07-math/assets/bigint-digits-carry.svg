<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">高精度整数的低位存储与逐位进位</title>
<desc id="desc">12030按个位到最高位保存成0、3、0、2、1。999加1时，三个9依次加上进位变成0，最后再补一位1，结果数组是0、0、0、1。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2775ae"/></marker></defs>
<rect width="1040" height="620" fill="#fff"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1d3345">
<text x="28" y="38" font-size="25" font-weight="700">数很大，但每轮只计算一位</text>
<rect x="24" y="60" width="992" height="214" rx="12" fill="#f6f9fc" stroke="#c3d3df"/>
<text x="45" y="96" font-size="20" font-weight="700">① 12030 → 个位先存，最高位后存</text>
<text x="60" y="165" font-size="30" font-weight="700">12030</text>
<path d="M175,155 L280,155" fill="none" stroke="#2775ae" stroke-width="3" marker-end="url(#arrow)"/>
<g text-anchor="middle" font-size="17" fill="#586e80">
<text x="370" y="126">i = 0</text><text x="480" y="126">1</text><text x="590" y="126">2</text><text x="700" y="126">3</text><text x="810" y="126">4</text>
</g>
<g fill="#fff" stroke="#2775ae" stroke-width="2">
<rect x="319" y="138" width="102" height="52" rx="5"/><rect x="429" y="138" width="102" height="52" rx="5"/>
<rect x="539" y="138" width="102" height="52" rx="5"/><rect x="649" y="138" width="102" height="52" rx="5"/><rect x="759" y="138" width="102" height="52" rx="5"/>
</g>
<g text-anchor="middle" font-size="26" font-weight="700">
<text x="370" y="173">0</text><text x="480" y="173">3</text><text x="590" y="173">0</text><text x="700" y="173">2</text><text x="810" y="173">1</text>
</g>
<g text-anchor="middle" font-size="16" fill="#586e80">
<text x="370" y="215">个位</text><text x="480" y="215">十位</text><text x="590" y="215">百位</text><text x="700" y="215">千位</text><text x="810" y="215">万位</text>
</g>
<text x="45" y="250" font-size="17">加减法从低位往高位；输出时从最高位倒着读，得到正常的十进制顺序。</text>
<rect x="24" y="294" width="992" height="283" rx="12" fill="#f6f9fc" stroke="#c3d3df"/>
<text x="45" y="330" font-size="20" font-weight="700">② 999 + 1：本位留下余数，进位交给下一位</text>
<path d="M400,353 L890,353" fill="none" stroke="#2775ae" stroke-width="2.5" marker-end="url(#arrow)"/>
<g text-anchor="middle" font-size="17" font-weight="700">
<text x="450" y="381">个位 i=0</text><text x="600" y="381">十位 i=1</text><text x="750" y="381">百位 i=2</text><text x="900" y="381">补最高位</text>
</g>
<g stroke="#d5e0e8" stroke-width="1">
<path d="M45,391 H990 M45,424 H990 M45,457 H990 M45,490 H990 M45,523 H990 M45,556 H990"/>
</g>
<g font-size="18">
<text x="65" y="414">a 的本位</text><text x="65" y="447">b 的本位（缺位补 0）</text><text x="65" y="480">传入 carry</text><text x="65" y="513" font-weight="700">留下的结果位</text><text x="65" y="546">传出 carry</text>
</g>
<g text-anchor="middle" font-size="21">
<text x="450" y="414">9</text><text x="600" y="414">9</text><text x="750" y="414">9</text><text x="900" y="414">0</text>
<text x="450" y="447">1</text><text x="600" y="447">0</text><text x="750" y="447">0</text><text x="900" y="447">0</text>
<text x="450" y="480">0</text><text x="600" y="480">1</text><text x="750" y="480">1</text><text x="900" y="480">1</text>
<g fill="#2775ae" font-weight="700"><text x="450" y="513">0</text><text x="600" y="513">0</text><text x="750" y="513">0</text><text x="900" y="513">1</text></g>
<text x="450" y="546">1</text><text x="600" y="546">1</text><text x="750" y="546">1</text><text x="900" y="546">0</text>
</g>
<text x="30" y="607" font-size="19" font-weight="700">结果数组 [0,0,0,1] → 倒着输出 1000；末尾进位不能丢。</text>
</g>
</svg>

<text x="46" y="449" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#7c3aed" font-weight="700">高亮格 C[0][1]：取 A 的第 0 行、B 的第 1 列。</text>
<text x="46" y="491" font-family="Microsoft YaHei, sans-serif" font-size="26" fill="#0f172a" font-weight="700">C[0][1] = 1×2 + 2×1 + 3×4 = 16</text>
<text x="46" y="535" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#0f172a" font-weight="400">内部维度 3 要相同；A 的行数 2 与 B 的列数 2 决定结果形状。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1450" viewBox="0 0 1100 1450" role="img"><title>三轮完整层扩展找到最短距离3</title><desc>从实际教学代码记录的三轮结果。起点层S到AB，终点反层T到DC，再从AB完整展开到XC，在C相遇；dsC2加dtC1等于3。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1100" height="1450" fill="#f8fafc"/>
<g font-family="Microsoft YaHei,sans-serif" fill="#172b4d">
<text x="30" y="42" font-size="26" fill="#172b4d" font-weight="bold">同一张图：上路 4 步，下路 3 步；每条边代价都是 1</text>
<text x="30" y="81" font-size="19" fill="#172b4d" font-weight="normal">蓝：起点侧已发现；橙：终点侧已发现；紫：相遇；粗边圈：当前层。</text>
<rect x="20" y="110" width="1060" height="415" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="146" font-size="21" fill="#172b4d" font-weight="bold">① 展开起点层 [S]，发现 [A,B]</text>
<path d="M114.29668110815317,277.7441214826083 L271.965367952131,217.67985982775963" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M326.0,207.0 L480.0,207.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M536.0,207.0 L690.0,207.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M744.9996226386614,214.14274932533183 L971.1542815707753,278.7583661630787" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M114.8502542267707,294.6462320697756 L321.3266297383415,358.1774245348743" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M376.0,367.0 L700.0,367.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M754.9287509304181,359.6137034280243 L971.2360566187484,295.5226498907412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<circle cx="90" cy="287" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="82" y="295" font-size="23" fill="#172b4d" font-weight="bold">S</text>
<circle cx="300" cy="207" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="292" y="215" font-size="23" fill="#172b4d" font-weight="bold">A</text>
<circle cx="510" cy="207" r="25" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="502" y="215" font-size="23" fill="#172b4d" font-weight="bold">X</text>
<circle cx="720" cy="207" r="25" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="712" y="215" font-size="23" fill="#172b4d" font-weight="bold">D</text>
<circle cx="1000" cy="287" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
<text x="992" y="295" font-size="23" fill="#172b4d" font-weight="bold">T</text>
<circle cx="350" cy="367" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="342" y="375" font-size="23" fill="#172b4d" font-weight="bold">B</text>
<circle cx="730" cy="367" r="25" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="722" y="375" font-size="23" fill="#172b4d" font-weight="bold">C</text>
<text x="42" y="420" font-size="20" fill="#1d4ed8" font-weight="normal">front_s = [A,B]，depth_s = 1</text>
<text x="580" y="420" font-size="20" fill="#c2410c" font-weight="normal">front_t = [T]，depth_t = 0</text>
<text x="42" y="457" font-size="18" fill="#172b4d" font-weight="normal">ds = {S:0, A:1, B:1}</text>
<text x="580" y="457" font-size="18" fill="#172b4d" font-weight="normal">dt = {T:0}</text>
<text x="42" y="496" font-size="20" fill="#64748b" font-weight="bold">本轮尚未相遇，继续选择较小层。</text>
<rect x="20" y="545" width="1060" height="415" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="581" font-size="21" fill="#172b4d" font-weight="bold">② 终点层更小：沿前驱展开 [T]，发现 [D,C]</text>
<path d="M114.29668110815317,712.7441214826083 L271.965367952131,652.6798598277596" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M326.0,642.0 L480.0,642.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M536.0,642.0 L690.0,642.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M744.9996226386614,649.1427493253318 L971.1542815707753,713.7583661630787" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M114.8502542267707,729.6462320697756 L321.3266297383415,793.1774245348743" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M376.0,802.0 L700.0,802.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M754.9287509304181,794.6137034280242 L971.2360566187484,730.5226498907413" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<circle cx="90" cy="722" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="82" y="730" font-size="23" fill="#172b4d" font-weight="bold">S</text>
<circle cx="300" cy="642" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="292" y="650" font-size="23" fill="#172b4d" font-weight="bold">A</text>
<circle cx="510" cy="642" r="25" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
<text x="502" y="650" font-size="23" fill="#172b4d" font-weight="bold">X</text>
<circle cx="720" cy="642" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
<text x="712" y="650" font-size="23" fill="#172b4d" font-weight="bold">D</text>
<circle cx="1000" cy="722" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="992" y="730" font-size="23" fill="#172b4d" font-weight="bold">T</text>
<circle cx="350" cy="802" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="342" y="810" font-size="23" fill="#172b4d" font-weight="bold">B</text>
<circle cx="730" cy="802" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
<text x="722" y="810" font-size="23" fill="#172b4d" font-weight="bold">C</text>
<text x="42" y="855" font-size="20" fill="#1d4ed8" font-weight="normal">front_s = [A,B]，depth_s = 1</text>
<text x="580" y="855" font-size="20" fill="#c2410c" font-weight="normal">front_t = [D,C]，depth_t = 1</text>
<text x="42" y="892" font-size="18" fill="#172b4d" font-weight="normal">ds = {S:0, A:1, B:1}</text>
<text x="580" y="892" font-size="18" fill="#172b4d" font-weight="normal">dt = {D:1, C:1, T:0}</text>
<text x="42" y="931" font-size="20" fill="#64748b" font-weight="bold">本轮尚未相遇，继续选择较小层。</text>
<rect x="20" y="980" width="1060" height="415" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="1016" font-size="21" fill="#172b4d" font-weight="bold">③ 两层同样大：完整展开 [A,B]，先发现 X，再在 C 相遇</text>
<path d="M114.29668110815317,1147.7441214826083 L271.965367952131,1087.6798598277596" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M326.0,1077.0 L480.0,1077.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M536.0,1077.0 L690.0,1077.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M744.9996226386614,1084.1427493253318 L971.1542815707753,1148.7583661630786" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M114.8502542267707,1164.6462320697756 L321.3266297383415,1228.1774245348743" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M376.0,1237.0 L700.0,1237.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M754.9287509304181,1229.6137034280243 L971.2360566187484,1165.5226498907411" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<circle cx="90" cy="1157" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="82" y="1165" font-size="23" fill="#172b4d" font-weight="bold">S</text>
<circle cx="300" cy="1077" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="292" y="1085" font-size="23" fill="#172b4d" font-weight="bold">A</text>
<circle cx="510" cy="1077" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
<text x="502" y="1085" font-size="23" fill="#172b4d" font-weight="bold">X</text>
<circle cx="720" cy="1077" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/>
<text x="712" y="1085" font-size="23" fill="#172b4d" font-weight="bold">D</text>
<circle cx="1000" cy="1157" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="992" y="1165" font-size="23" fill="#172b4d" font-weight="bold">T</text>
<circle cx="350" cy="1237" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="342" y="1245" font-size="23" fill="#172b4d" font-weight="bold">B</text>
<circle cx="730" cy="1237" r="25" fill="#f3e8ff" stroke="#9333ea" stroke-width="4"/>
<text x="722" y="1245" font-size="23" fill="#172b4d" font-weight="bold">C</text>
<text x="42" y="1290" font-size="20" fill="#1d4ed8" font-weight="normal">front_s = [X,C]，depth_s = 2</text>
<text x="580" y="1290" font-size="20" fill="#c2410c" font-weight="normal">front_t = [D,C]，depth_t = 1</text>
<text x="42" y="1327" font-size="18" fill="#172b4d" font-weight="normal">ds = {S:0, A:1, B:1, X:2, C:2}</text>
<text x="580" y="1327" font-size="18" fill="#172b4d" font-weight="normal">dt = {D:1, C:1, T:0}</text>
<text x="42" y="1366" font-size="20" fill="#7e22ce" font-weight="bold">返回 ds[C] + dt[C] = 2 + 1 = 3，不再额外加一步。</text>
<text x="30" y="1440" font-size="20" fill="#172b4d" font-weight="normal">距离表保留全部已发现状态；front 仅保留当前等待展开的一层。</text>
</g></svg>
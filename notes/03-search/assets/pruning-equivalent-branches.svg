<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="635" viewBox="0 0 1100 635" role="img"><title>相同数值的交换，只改变内部编号，不产生新答案</title><desc>1a与1b代表两个数值相同的1。以它们分别开头的子树都输出112、121，因此数值排列只需保留一支。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1100" height="635" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#172b4d">
<text x="35" y="44" font-size="27" fill="#172b4d" font-weight="bold">先确认题目只区分数值，再消除重复表示</text>
<text x="35" y="82" font-size="20" fill="#172b4d" font-weight="normal">输入 1、1、2；临时标为 1a、1b、2，其中 a、b 不属于输出。</text>
<rect x="375" y="111" width="350" height="61" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
<text x="435" y="151" font-size="23" fill="#172b4d" font-weight="bold">当前前缀为空</text>
<path d="M440,172 L265,235" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="225" y="208" font-size="19" fill="#172b4d" font-weight="normal">首位选 1a</text>
<path d="M660,172 L830,235" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
<text x="760" y="208" font-size="19" fill="#172b4d" font-weight="normal">首位选 1b</text>
<rect x="55" y="241" width="440" height="246" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
<rect x="605" y="241" width="440" height="246" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2" />
<text x="78" y="280" font-size="22" fill="#047857" font-weight="bold">保留这一种表示</text>
<text x="628" y="280" font-size="20" fill="#b45309" font-weight="bold">后一支是相同数值答案的重复表示</text>
<text x="78" y="328" font-size="21" fill="#172b4d" font-weight="normal">内部选择：1a 1b 2</text>
<text x="78" y="363" font-size="21" fill="#172b4d" font-weight="normal">实际输出：1 1 2</text>
<text x="78" y="411" font-size="21" fill="#172b4d" font-weight="normal">内部选择：1a 2 1b</text>
<text x="78" y="446" font-size="21" fill="#172b4d" font-weight="normal">实际输出：1 2 1</text>
<text x="628" y="328" font-size="21" fill="#172b4d" font-weight="normal">内部选择：1b 1a 2</text>
<text x="628" y="363" font-size="21" fill="#172b4d" font-weight="normal">实际输出：1 1 2</text>
<text x="628" y="411" font-size="21" fill="#172b4d" font-weight="normal">内部选择：1b 2 1a</text>
<text x="628" y="446" font-size="21" fill="#172b4d" font-weight="normal">实际输出：1 2 1</text>
<text x="35" y="535" font-size="20" fill="#172b4d" font-weight="normal">这里只比较首位为 1 的两支；首位为 2 的分支仍要正常搜索。</text>
<text x="35" y="580" font-size="20" fill="#b91c1c" font-weight="normal">若输出区分 a、b，或两个实体附带不同限制，就不能把两支视为等价。</text>
</g></svg>
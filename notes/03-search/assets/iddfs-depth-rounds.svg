<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1250" viewBox="0 0 1100 1250" role="img"><title>迭代加深：上限0、1、2的真实递归路径</title><desc>同一份通用代码在S到T图上运行，依次限制0/1/2步。调用次数1/3/5，上限2时先沿A到C失败，再经B到T，left为0时成功。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1100" height="1250" fill="#f8fafc"/>
<g font-family="Microsoft YaHei,sans-serif" fill="#172b4d">
<text x="30" y="43" font-size="26" fill="#172b4d" font-weight="bold">每轮从 S 重来：0 步失败、1 步失败、2 步找到 T</text>
<text x="30" y="82" font-size="20" fill="#172b4d" font-weight="normal">邻居先 A 后 B；上路 S→A→C→D→T 要4步，下路 S→B→T 只要2步。</text>
<path d="M114.43462901069935,206.11468035974568 L282.74599071883534,144.91054882951443" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M336.0,135.0 L491.0,135.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M546.0,135.0 L701.0,135.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M754.9287509304181,142.38629657197572 L972.1948547314568,206.76143843895017" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M115.05146565037845,221.95874045843846 L422.0579806207317,307.23832795020326" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
<path d="M475.5806176625976,310.3489786068004 L971.4677726071027,220.1876777077995" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)"/>
<circle cx="90" cy="215" r="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="82" y="223" font-size="24" fill="#172b4d" font-weight="bold">S</text>
<circle cx="310" cy="135" r="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="302" y="143" font-size="24" fill="#172b4d" font-weight="bold">A</text>
<circle cx="520" cy="135" r="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="512" y="143" font-size="24" fill="#172b4d" font-weight="bold">C</text>
<circle cx="730" cy="135" r="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="722" y="143" font-size="24" fill="#172b4d" font-weight="bold">D</text>
<circle cx="1000" cy="215" r="25" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="992" y="223" font-size="24" fill="#172b4d" font-weight="bold">T</text>
<circle cx="450" cy="315" r="25" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="442" y="323" font-size="24" fill="#172b4d" font-weight="bold">B</text>
<rect x="25" y="365" width="1050" height="151" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="45" y="399" font-size="23" fill="#172b4d" font-weight="bold">limit = 0：未找到，下一轮重搜</text>
<text x="45" y="439" font-size="18" fill="#64748b" font-weight="normal">调用次序</text>
<text x="200" y="439" font-size="18" fill="#64748b" font-weight="normal">当前 path</text>
<text x="620" y="439" font-size="18" fill="#64748b" font-weight="normal">left</text>
<text x="730" y="439" font-size="18" fill="#64748b" font-weight="normal">本次判断</text>
<text x="70" y="476" font-size="20" fill="#172b4d" font-weight="normal">1</text>
<text x="200" y="476" font-size="21" fill="#172b4d" font-weight="normal">S</text>
<text x="632" y="476" font-size="21" fill="#172b4d" font-weight="normal">0</text>
<text x="730" y="476" font-size="20" fill="#b45309" font-weight="normal">到上限，返回失败</text>
<rect x="25" y="540" width="1050" height="235" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="45" y="574" font-size="23" fill="#172b4d" font-weight="bold">limit = 1：未找到，下一轮重搜</text>
<text x="45" y="614" font-size="18" fill="#64748b" font-weight="normal">调用次序</text>
<text x="200" y="614" font-size="18" fill="#64748b" font-weight="normal">当前 path</text>
<text x="620" y="614" font-size="18" fill="#64748b" font-weight="normal">left</text>
<text x="730" y="614" font-size="18" fill="#64748b" font-weight="normal">本次判断</text>
<text x="70" y="651" font-size="20" fill="#172b4d" font-weight="normal">1</text>
<text x="200" y="651" font-size="21" fill="#172b4d" font-weight="normal">S</text>
<text x="632" y="651" font-size="21" fill="#172b4d" font-weight="normal">1</text>
<text x="730" y="651" font-size="20" fill="#172b4d" font-weight="normal">继续递归后继</text>
<text x="70" y="694" font-size="20" fill="#172b4d" font-weight="normal">2</text>
<text x="200" y="694" font-size="21" fill="#172b4d" font-weight="normal">S → A</text>
<text x="632" y="694" font-size="21" fill="#172b4d" font-weight="normal">0</text>
<text x="730" y="694" font-size="20" fill="#b45309" font-weight="normal">到上限，返回失败</text>
<text x="70" y="737" font-size="20" fill="#172b4d" font-weight="normal">3</text>
<text x="200" y="737" font-size="21" fill="#172b4d" font-weight="normal">S → B</text>
<text x="632" y="737" font-size="21" fill="#172b4d" font-weight="normal">0</text>
<text x="730" y="737" font-size="20" fill="#b45309" font-weight="normal">到上限，返回失败</text>
<rect x="25" y="800" width="1050" height="345" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="45" y="834" font-size="23" fill="#172b4d" font-weight="bold">limit = 2：成功，保留路径 S → B → T</text>
<text x="45" y="874" font-size="18" fill="#64748b" font-weight="normal">调用次序</text>
<text x="200" y="874" font-size="18" fill="#64748b" font-weight="normal">当前 path</text>
<text x="620" y="874" font-size="18" fill="#64748b" font-weight="normal">left</text>
<text x="730" y="874" font-size="18" fill="#64748b" font-weight="normal">本次判断</text>
<text x="70" y="911" font-size="20" fill="#172b4d" font-weight="normal">1</text>
<text x="200" y="911" font-size="21" fill="#172b4d" font-weight="normal">S</text>
<text x="632" y="911" font-size="21" fill="#172b4d" font-weight="normal">2</text>
<text x="730" y="911" font-size="20" fill="#172b4d" font-weight="normal">继续递归后继</text>
<text x="70" y="954" font-size="20" fill="#172b4d" font-weight="normal">2</text>
<text x="200" y="954" font-size="21" fill="#172b4d" font-weight="normal">S → A</text>
<text x="632" y="954" font-size="21" fill="#172b4d" font-weight="normal">1</text>
<text x="730" y="954" font-size="20" fill="#172b4d" font-weight="normal">继续递归后继</text>
<text x="70" y="997" font-size="20" fill="#172b4d" font-weight="normal">3</text>
<text x="200" y="997" font-size="21" fill="#172b4d" font-weight="normal">S → A → C</text>
<text x="632" y="997" font-size="21" fill="#172b4d" font-weight="normal">0</text>
<text x="730" y="997" font-size="20" fill="#b45309" font-weight="normal">到上限，返回失败</text>
<text x="70" y="1040" font-size="20" fill="#172b4d" font-weight="normal">4</text>
<text x="200" y="1040" font-size="21" fill="#172b4d" font-weight="normal">S → B</text>
<text x="632" y="1040" font-size="21" fill="#172b4d" font-weight="normal">1</text>
<text x="730" y="1040" font-size="20" fill="#172b4d" font-weight="normal">继续递归后继</text>
<rect x="40" y="1056" width="1015" height="36" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="70" y="1083" font-size="20" fill="#172b4d" font-weight="normal">5</text>
<text x="200" y="1083" font-size="21" fill="#172b4d" font-weight="bold">S → B → T</text>
<text x="632" y="1083" font-size="21" fill="#172b4d" font-weight="normal">0</text>
<text x="730" y="1083" font-size="20" fill="#047857" font-weight="normal">已经是目标，成功</text>
<text x="30" y="1190" font-size="21" fill="#172b4d" font-weight="bold">关键：left=0 时先检查目标；失败分支撤销，成功分支保留整条路径。</text>
<text x="30" y="1230" font-size="20" fill="#172b4d" font-weight="normal">表格逐项来自同一教学函数的实际进入顺序，不是 BFS 的逐层弹出顺序。</text>
</g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img"><title>两个上限的职责：先保证项数，再限制分母范围</title><desc>示意调度：固定limit，按1000、10000、100000、1000000、10000000放宽最大分母；全部范围失败才增加limit。首次成功范围内比较所有可能改善末分母的方案。不是题目具体输入的运行记录。</desc>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L9,5 L0,10" fill="#64748b"/></marker></defs>
<rect width="1120" height="810" fill="#f8fafc"/>
<g fill="#172b4d" font-family="Microsoft YaHei,sans-serif">
<text x="30" y="46" font-size="27" fill="#172b4d" font-weight="bold">两层循环：外层管项数，内层逐步放宽分母范围</text>
<text x="30" y="88" font-size="21" fill="#172b4d" font-weight="normal">这是调度示意，不预设某个输入会在哪一轮成功。</text>
<rect x="30" y="125" width="1060" height="185" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="165" font-size="23" fill="#172b4d" font-weight="bold">固定当前 limit：最多用这些项，逐个扩大允许的最大分母 M</text>
<rect x="50" y="199" width="177" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="62" y="241" font-size="23" fill="#172b4d" font-weight="normal">1,000</text>
<path d="M230,232 L251,232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="259" y="199" width="177" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="271" y="241" font-size="23" fill="#172b4d" font-weight="normal">10,000</text>
<path d="M439,232 L460,232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="468" y="199" width="177" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="480" y="241" font-size="23" fill="#172b4d" font-weight="normal">100,000</text>
<path d="M648,232 L669,232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="677" y="199" width="177" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="689" y="241" font-size="23" fill="#172b4d" font-weight="normal">1,000,000</text>
<path d="M857,232 L878,232" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="886" y="199" width="177" height="66" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
<text x="898" y="241" font-size="23" fill="#172b4d" font-weight="normal">10,000,000</text>
<text x="52" y="290" font-size="20" fill="#172b4d" font-weight="normal">每次重新清空 path、best_path，并令 best_last = LLONG_MAX。</text>
<path d="M290,315 L290,355" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<path d="M825,315 L825,355" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="369" width="505" height="155" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="52" y="410" font-size="24" fill="#172b4d" font-weight="bold">所有范围都失败</text>
<text x="52" y="455" font-size="21" fill="#172b4d" font-weight="normal">才令 limit++，再从 M=1000 重来。</text>
<text x="52" y="494" font-size="21" fill="#172b4d" font-weight="normal">项数更少的轮次已经被排除。</text>
<rect x="565" y="369" width="525" height="155" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
<text x="587" y="410" font-size="24" fill="#172b4d" font-weight="bold">某个范围首次成功</text>
<text x="587" y="455" font-size="21" fill="#172b4d" font-weight="normal">本次 DFS 仍比较不同前缀的答案。</text>
<text x="587" y="494" font-size="21" fill="#172b4d" font-weight="normal">完成后输出 best_path，结束全部循环。</text>
<path d="M825,530 L825,565" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
<rect x="30" y="582" width="1060" height="140" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="52" y="624" font-size="24" fill="#172b4d" font-weight="bold">为什么成功后不必再放宽 M？</text>
<text x="52" y="667" font-size="22" fill="#172b4d" font-weight="normal">范围内的最好末分母 ≤ M；范围外的方案末分母 &gt; M，不可能改善它。</text>
<text x="52" y="704" font-size="21" fill="#172b4d" font-weight="normal">所以：先做完本轮最优值比较，再结束；不是遇到第一个完整方案就结束。</text>
<text x="30" y="777" font-size="21" fill="#172b4d" font-weight="bold">项数上限负责第一目标；分母上限负责控制搜索范围；best_last 负责第二目标。</text>
</g></svg>
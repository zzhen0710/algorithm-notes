<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" role="img"><title>各弹一个节点就换边，会先碰到更长的路线</title><desc>错误调度先从S发现AB，从T发现DC，再展开A发现X，展开D反向发现X，得到4；B和C尚未展开，真正最短路线S-B-C-T只有3步。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1100" height="840" fill="#f8fafc"/>
<g font-family="Microsoft YaHei,sans-serif" fill="#172b4d">
<text x="30" y="42" font-size="27" fill="#172b4d" font-weight="bold">反例：逐节点交替，第一次相遇不保证最短</text>
<text x="30" y="81" font-size="20" fill="#172b4d" font-weight="normal">两侧各处理一个节点就换边；S 的邻居顺序 A,B，T 的前驱顺序 D,C。</text>
<path d="M114.29668110815317,235.7441214826083 L271.965367952131,175.67985982775963" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M326.0,165.0 L480.0,165.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M536.0,165.0 L690.0,165.0" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M744.9996226386614,172.14274932533183 L971.1542815707753,236.75836616307865" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M114.8502542267707,252.6462320697756 L321.3266297383415,316.1774245348743" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M376.0,325.0 L700.0,325.0" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)" />
<path d="M754.9287509304181,317.6137034280243 L971.2360566187484,253.5226498907412" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow)" />
<circle cx="90" cy="245" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="82" y="253" font-size="23" fill="#172b4d" font-weight="bold">S</text>
<circle cx="300" cy="165" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="292" y="173" font-size="23" fill="#172b4d" font-weight="bold">A</text>
<circle cx="510" cy="165" r="25" fill="#f3e8ff" stroke="#9333ea" stroke-width="2"/>
<text x="502" y="173" font-size="23" fill="#172b4d" font-weight="bold">X</text>
<circle cx="720" cy="165" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="712" y="173" font-size="23" fill="#172b4d" font-weight="bold">D</text>
<circle cx="1000" cy="245" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="992" y="253" font-size="23" fill="#172b4d" font-weight="bold">T</text>
<circle cx="350" cy="325" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="342" y="333" font-size="23" fill="#172b4d" font-weight="bold">B</text>
<circle cx="730" cy="325" r="25" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="722" y="333" font-size="23" fill="#172b4d" font-weight="bold">C</text>
<text x="380" y="135" font-size="20" fill="#7e22ce" font-weight="bold">先在 X 碰头：2 + 2 = 4</text>
<text x="370" y="375" font-size="20" fill="#047857" font-weight="bold">绿色路线 S → B → C → T 只要 3 步</text>
<rect x="30" y="410" width="1040" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="50" y="445" font-size="19" fill="#172b4d" font-weight="bold">轮次</text>
<text x="160" y="445" font-size="19" fill="#172b4d" font-weight="bold">展开节点</text>
<text x="325" y="445" font-size="19" fill="#172b4d" font-weight="bold">发生什么</text>
<text x="65" y="492" font-size="21" fill="#172b4d" font-weight="normal">1</text>
<text x="180" y="492" font-size="21" fill="#172b4d" font-weight="bold">S</text>
<text x="325" y="492" font-size="20" fill="#172b4d" font-weight="normal">起点侧安排 A、B，距离都是 1</text>
<text x="65" y="540" font-size="21" fill="#172b4d" font-weight="normal">2</text>
<text x="180" y="540" font-size="21" fill="#172b4d" font-weight="bold">T</text>
<text x="325" y="540" font-size="20" fill="#172b4d" font-weight="normal">终点侧安排 D、C，反向距离都是 1</text>
<text x="65" y="588" font-size="21" fill="#172b4d" font-weight="normal">3</text>
<text x="180" y="588" font-size="21" fill="#172b4d" font-weight="bold">A</text>
<text x="325" y="588" font-size="20" fill="#172b4d" font-weight="normal">起点侧发现 X，距离为 2；B 尚未展开</text>
<text x="65" y="636" font-size="21" fill="#172b4d" font-weight="normal">4</text>
<text x="180" y="636" font-size="21" fill="#172b4d" font-weight="bold">D</text>
<text x="325" y="636" font-size="20" fill="#172b4d" font-weight="normal">终点侧反向发现 X，距离为 2；C 尚未展开</text>
<rect x="30" y="689" width="1040" height="104" rx="12" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
<text x="50" y="728" font-size="21" fill="#b91c1c" font-weight="bold">问题：距离为 1 的整层还没处理完，部分距离为 2 的状态就参与了碰头。</text>
<text x="50" y="768" font-size="20" fill="#172b4d" font-weight="normal">整层版本会在同一轮处理 A、B，在 C 找到 3 步；不能只看到“碰头”就停止。</text>
</g></svg>
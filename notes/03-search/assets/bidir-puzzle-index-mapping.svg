<text x="623" y="482" font-size="28" fill="#172b4d" font-weight="bold">8</text>
<rect x="670" y="440" width="65" height="65" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="693" y="482" font-size="28" fill="#172b4d" font-weight="bold">4</text>
<rect x="740" y="440" width="65" height="65" rx="10" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
<text x="763" y="482" font-size="28" fill="#172b4d" font-weight="bold">0</text>
<rect x="810" y="440" width="65" height="65" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="833" y="482" font-size="28" fill="#172b4d" font-weight="bold">7</text>
<rect x="880" y="440" width="65" height="65" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="903" y="482" font-size="28" fill="#172b4d" font-weight="bold">6</text>
<rect x="950" y="440" width="65" height="65" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="973" y="482" font-size="28" fill="#172b4d" font-weight="bold">5</text>
<text x="390" y="300" font-size="20" fill="#172b4d" font-weight="bold">z = 4：x = 4 / 3 = 1，y = 4 % 3 = 1</text>
<text x="390" y="345" font-size="21" fill="#172b4d" font-weight="bold">右邻 (1,2) → 1 × 3 + 2 = 5</text>
<path d="M690,365 L690,412" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="390" y="540" font-size="20" fill="#172b4d" font-weight="normal">先 v = u，再 swap(v[4], v[5])；原状态 u 不变。</text>
<rect x="30" y="585" width="1040" height="195" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
<text x="50" y="624" font-size="23" fill="#172b4d" font-weight="bold">推广到每行 m 列：</text>
<text x="50" y="668" font-size="24" fill="#1d4ed8" font-weight="normal">row = pos / m</text>
<text x="500" y="668" font-size="24" fill="#1d4ed8" font-weight="normal">col = pos % m</text>
<text x="50" y="714" font-size="24" fill="#1d4ed8" font-weight="normal">pos = row × m + col</text>
<text x="50" y="757" font-size="21" fill="#172b4d" font-weight="normal">整行用商计算，本行偏移用余数计算；除数是列数。</text>
<text x="30" y="824" font-size="20" fill="#172b4d" font-weight="normal">这里只画向右这一步；其余合法方向也各自生成独立的候选副本。</text>
</g></svg>
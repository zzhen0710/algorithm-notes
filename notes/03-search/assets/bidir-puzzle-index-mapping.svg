<text x="225" y="363" font-size="28" fill="#172b4d" font-weight="bold">5</text>
<text x="37" y="433" font-size="20" fill="#172b4d" font-weight="normal">空格 (1,1) → 右邻 (1,2)</text>
<text x="350" y="230" font-size="25" fill="#172b4d" font-weight="bold">u</text>
<text x="416" y="175" font-size="18" fill="#64748b" font-weight="normal">0</text>

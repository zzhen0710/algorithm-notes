<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="855" viewBox="0 0 1100 855" role="img"><title>同一棋盘：一维位置到行列，再换回一维位置</title><desc>目标字符串123804765的空格下标为4，对应行1列1；右邻行1列2对应下标5。每个候选复制原字符串，交换位置4和5得到123840765。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#64748b"/></marker></defs>
<rect width="1100" height="855" fill="#f8fafc"/>
<g font-family="Microsoft YaHei,sans-serif" fill="#172b4d">
<text x="30" y="43" font-size="25" fill="#172b4d" font-weight="bold">先把空格下标换成行列，检查邻格，再换回字符串下标</text>
<text x="30" y="82" font-size="20" fill="#172b4d" font-weight="normal">例：u = 123804765；空格字符是 0，它在字符串中的位置 z = 4。</text>
<text x="45" y="129" font-size="20" fill="#172b4d" font-weight="bold">行 x / 列 y（0 下标）</text>

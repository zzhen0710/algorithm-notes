<text x="24" y="40" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#0f172a" font-weight="700">01 AOE 模型：点是事件，边是需要时间的活动</text>
<text x="24" y="77" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="400">箭头旁为“原边 id / 耗时”；事件本身不再另外消耗时间。</text>

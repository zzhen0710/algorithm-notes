<text x="588" y="207" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#2563eb" font-weight="700">事件</text>
<circle cx="970" cy="285" r="27" fill="#fff" stroke="#2563eb" stroke-width="3"/>
<text x="964" y="293" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a" font-weight="700">6</text>
<rect x="904" y="318" width="132" height="27" rx="3" fill="#fff" stroke="none"/>
<text x="908" y="337" font-family="Microsoft YaHei, sans-serif" font-size="15" fill="#2563eb" font-weight="700">事件</text>
<text x="35" y="538" font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#0f172a" font-weight="700">先看两条到事件 4 的分支：</text>
<text x="50" y="578" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#0f172a" font-weight="400">1→2→4：耗时 3+4=7；1→3→4：耗时 2+1=3。</text>
<text x="50" y="617" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#0f172a" font-weight="400">事件 4 必须等两条前置分支，所以最早时刻为 max(7,3)=7。</text>
<rect x="30" y="656" width="1040" height="190" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="48" y="690" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#2563eb" font-weight="700">这条依赖链最长，却决定整个项目最快也要多久。</text>
<text x="48" y="731" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#0f172a" font-weight="400">串行分支：1→2→4→6 的耗时是 3+4+2=9。</text>
<text x="48" y="769" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#0f172a" font-weight="400">其他活动可以并行，但不能使这条依赖链凭空缩短。</text>
<text x="48" y="809" font-family="Microsoft YaHei, sans-serif" font-size="19" fill="#0f172a" font-weight="400">下一步：在“不超过工期 9”的约束下，倒着找各事件最晚能等到何时。</text>
</svg>
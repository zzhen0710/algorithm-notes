<text x="706" y="231" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b" font-weight="400">1</text>
<text x="736" y="256" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#2563eb" font-weight="700">1</text>

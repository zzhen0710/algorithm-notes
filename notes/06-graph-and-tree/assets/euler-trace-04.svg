<text x="930" y="231" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b" font-weight="400">3</text>
<text x="960" y="256" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#2563eb" font-weight="700">1</text>
<text x="470" y="302" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#0f172a" font-weight="700">st（左栈底 → 右栈顶）</text>
<text x="470" y="336" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#2563eb" font-weight="700">1 → 2 → 3 → 1</text>
<text x="470" y="376" font-family="Microsoft YaHei, sans-serif" font-size="16" fill="#0f172a" font-weight="700">path（当前存储顺序）</text>
<text x="470" y="413" font-family="Microsoft YaHei, sans-serif" font-size="22" fill="#2563eb" font-weight="700">4</text>
<text x="470" y="468" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#475569" font-weight="400">构造中：path 是逆序收尾结果</text>
<rect x="22" y="512" width="1055" height="122" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="40" y="544" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="400">stack=[1,2,3,1] 记录了一个尚未收尾的环；path 中仍然只有 4。</text>
<text x="40" y="575" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="400">接下来最右侧的 1 会跳过 e3 的反向记录，然后加入 path。</text>
<text x="40" y="606" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="400">注意：栈里有两个 1，是两次到达同一个节点；不是两条不同原边。</text>
</svg>
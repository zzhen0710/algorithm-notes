<text x="212.5" y="310.0" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#2563eb" font-weight="700">e3</text>
<circle cx="115" cy="225" r="25" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<text x="109" y="232" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a" font-weight="700">1</text>

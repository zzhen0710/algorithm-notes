<text x="89" y="422" font-family="Microsoft YaHei, sans-serif" font-size="23" fill="#0f172a" font-weight="700">4</text>
<text x="42" y="458" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="400">固定边表：e0=1—4，e1=1—2</text>
<text x="42" y="482" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="400">e2=2—3，e3=3—1</text>
<rect x="450" y="92" width="627" height="402" rx="8" fill="#fff" stroke="#cbd5e1"/>
<text x="470" y="121" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="700">状态快照（蓝格：相对上一张图变化）</text>
<text x="470" y="175" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#0f172a" font-weight="700">next[u]</text>
<rect x="585" y="143" width="98" height="54" rx="8" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="594" y="161" font-family="Microsoft YaHei, sans-serif" font-size="13" fill="#64748b" font-weight="400">1</text>
<text x="624" y="186" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#2563eb" font-weight="700">2</text>

<text x="960" y="186" font-family="Microsoft YaHei, sans-serif" font-size="21" fill="#0f172a" font-weight="700">1</text>
<text x="470" y="245" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#0f172a" font-weight="700">used[id]</text>

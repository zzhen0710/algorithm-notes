<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660">
<rect x="0" y="0" width="1100" height="660" rx="0" fill="#f8fafc" stroke="none"/>
<text x="25" y="38" font-family="Microsoft YaHei, sans-serif" font-size="25" fill="#0f172a" font-weight="700">04 从 1 补上一个环，再次走到 1</text>
<text x="25" y="70" font-family="Microsoft YaHei, sans-serif" font-size="17" fill="#0f172a" font-weight="400">依次消耗 e1、e2、e3；同一节点可以多次入栈，原边不能重复。</text>

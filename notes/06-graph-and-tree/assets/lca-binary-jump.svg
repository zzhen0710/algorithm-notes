<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#ea580c"/></marker></defs><rect width="1180" height="360" rx="16" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="24" fill="#172b4d" text-anchor="start" font-weight="bold">祖先链 1 → 2 → … → 16：从 16 向上跳 13 步</text><text x="32" y="83" font-size="18" fill="#172b4d" text-anchor="start">13 的二进制为 1101，按高位到低位取 8、4、1；每次从当前节点继续。</text><circle cx="115" cy="175" r="42" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="115" y="185" font-size="30" fill="#172b4d" text-anchor="middle" font-weight="bold">16</text><circle cx="440" cy="175" r="42" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="440" y="185" font-size="30" fill="#172b4d" text-anchor="middle" font-weight="bold">8</text><circle cx="765" cy="175" r="42" fill="#dbeafe" stroke="#475569" stroke-width="2"/><text x="765" y="185" font-size="30" fill="#172b4d" text-anchor="middle" font-weight="bold">4</text><circle cx="1060" cy="175" r="42" fill="#dcfce7" stroke="#475569" stroke-width="2"/><text x="1060" y="185" font-size="30" fill="#172b4d" text-anchor="middle" font-weight="bold">3</text><path d="M165 175 H388" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/><text x="276.5" y="145" font-size="17" fill="#172b4d" text-anchor="middle">8 步：up[3][16]</text><path d="M490 175 H713" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/><text x="601.5" y="145" font-size="17" fill="#172b4d" text-anchor="middle">4 步：up[2][8]</text><path d="M815 175 H1008" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/><text x="911.5" y="145" font-size="17" fill="#172b4d" text-anchor="middle">1 步：up[0][4]</text><text x="32" y="269" font-size="22" fill="#172b4d" text-anchor="start" font-weight="bold">总步数：8 + 4 + 1 = 13；返回原节点 3。</text><text x="32" y="317" font-size="18" fill="#172b4d" text-anchor="start">表里存“跳到谁”；不能把几个祖先编号相加，也不能每次都从原节点 16 重新出发。</text></g></svg>

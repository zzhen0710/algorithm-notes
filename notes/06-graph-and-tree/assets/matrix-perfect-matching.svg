<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="410" viewBox="0 0 1120 410" role="img" aria-labelledby="title desc">
<title id="title">原对角线不必为一，按匹配重排列即可</title>
<desc id="desc">原矩阵的三行为010、001、100，匹配选择行一列二、行二列三、行三列一。把原列按二三一排序，矩阵变成单位阵，选中的三个一落在对角线。</desc>

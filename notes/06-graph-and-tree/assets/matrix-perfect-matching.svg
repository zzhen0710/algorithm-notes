<text x="408" y="353" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">原行不动，只调整列的位置。</text>
<text x="774" y="353" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">每行选中的 1 都到达对角线。</text>

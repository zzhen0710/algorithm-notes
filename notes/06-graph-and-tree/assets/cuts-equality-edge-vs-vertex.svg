<line x1="230.0" y1="317.5" x2="250.0" y2="337.5" stroke="#dc2626" stroke-width="3"/>
<line x1="230.0" y1="337.5" x2="250.0" y2="317.5" stroke="#dc2626" stroke-width="3"/>
<line x1="180" y1="375" x2="360" y2="405" stroke="#2563eb" stroke-width="4"/>
<line x1="360" y1="405" x2="300" y2="280" stroke="#2563eb" stroke-width="4"/>
<line x1="360" y1="405" x2="480" y2="405" stroke="#94a3b8" stroke-width="2"/>
<circle cx="90" cy="215" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="90" y="222" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">1</text>
<circle cx="205" cy="180" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="205" y="187" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">2</text>
<circle cx="300" cy="280" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="300" y="287" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">3</text>
<circle cx="180" cy="375" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="180" y="382" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">4</text>
<circle cx="360" cy="405" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="360" y="412" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">5</text>
<circle cx="480" cy="405" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="480" y="412" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">6</text>
<line x1="670" y1="215" x2="785" y2="180" stroke="#94a3b8" stroke-width="2"/>
<line x1="785" y1="180" x2="880" y2="280" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="880" y1="280" x2="670" y2="215" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="880" y1="280" x2="760" y2="375" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="760" y1="375" x2="940" y2="405" stroke="#94a3b8" stroke-width="2"/>
<line x1="940" y1="405" x2="880" y2="280" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="940" y1="405" x2="1060" y2="405" stroke="#94a3b8" stroke-width="2"/>
<circle cx="670" cy="215" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="670" y="222" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">1</text>
<circle cx="785" cy="180" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="785" y="187" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">2</text>
<circle cx="880" cy="280" r="25" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
<text x="880" y="287" font-size="21" fill="#64748b" text-anchor="middle" font-weight="bold">3</text>
<line x1="856" y1="256" x2="904" y2="304" stroke="#dc2626" stroke-width="3"/>
<line x1="856" y1="304" x2="904" y2="256" stroke="#dc2626" stroke-width="3"/>
<circle cx="760" cy="375" r="25" fill="white" stroke="#c2410c" stroke-width="3"/>
<text x="760" y="382" font-size="21" fill="#c2410c" text-anchor="middle" font-weight="bold">4</text>
<circle cx="940" cy="405" r="25" fill="white" stroke="#c2410c" stroke-width="3"/>
<text x="940" y="412" font-size="21" fill="#c2410c" text-anchor="middle" font-weight="bold">5</text>
<circle cx="1060" cy="405" r="25" fill="white" stroke="#c2410c" stroke-width="3"/>
<text x="1060" y="412" font-size="21" fill="#c2410c" text-anchor="middle" font-weight="bold">6</text>
<text x="45" y="480" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="normal">仍然连通，3—4 不是桥</text>
<text x="625" y="480" font-size="19" fill="#c2410c" text-anchor="start" font-weight="normal">{1,2} 与 {4,5,6} 分开，3 是割点</text>
<rect x="25" y="530" width="1130" height="70" rx="8" fill="#eff6ff" stroke="none"/>
<text x="42" y="558" font-size="18" fill="#172554" text-anchor="start" font-weight="bold">“只能回到 3”足以绕开一条边，却绕不开被删除的整个节点 3。</text>
<text x="42" y="585" font-size="17" fill="#172554" text-anchor="start" font-weight="normal">所以桥判定是 low[孩子] &gt; dfn[父亲]，非根割点判定是 low[孩子] &gt;= dfn[父亲]。</text>
</g></svg>
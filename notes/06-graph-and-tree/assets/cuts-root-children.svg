<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
<rect width="1180" height="620" rx="12" fill="white"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<text x="25" y="42" font-size="27" fill="#172554" text-anchor="start" font-weight="bold">第 6 节：根 —— 数 DFS 树孩子，不数原图度数</text>
<text x="25" y="78" font-size="17" fill="#475569" text-anchor="start" font-weight="normal">两图中根 1 的度数都是 2；删除根后的结果，却由 DFS 树孩子数量决定。</text>
<rect x="25" y="100" width="550" height="410" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<rect x="605" y="100" width="550" height="410" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="45" y="138" font-size="20" fill="#172554" text-anchor="start" font-weight="bold">三角形：根只有 1 个树孩子</text>
<line x1="300" y1="210" x2="160" y2="355" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="300" y1="210" x2="440" y2="355" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="160" y1="355" x2="440" y2="355" stroke="#2563eb" stroke-width="4"/>
<circle cx="300" cy="210" r="25" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
<text x="300" y="217" font-size="21" fill="#64748b" text-anchor="middle" font-weight="bold">1</text>
<line x1="276" y1="186" x2="324" y2="234" stroke="#dc2626" stroke-width="3"/>
<line x1="276" y1="234" x2="324" y2="186" stroke="#dc2626" stroke-width="3"/>
<circle cx="160" cy="355" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="160" y="362" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">2</text>
<circle cx="440" cy="355" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="440" y="362" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">3</text>
<text x="45" y="420" font-size="17" fill="#172554" text-anchor="start" font-weight="normal">删除前的 DFS：1 → 2 → 3</text>
<text x="45" y="458" font-size="19" fill="#172554" text-anchor="start" font-weight="normal">删除 1 后，2—3 仍连通</text>
<text x="45" y="489" font-size="19" fill="#1d4ed8" text-anchor="start" font-weight="normal">child[1] = 1，不是割点</text>
<text x="625" y="138" font-size="20" fill="#172554" text-anchor="start" font-weight="bold">两条分支：根有 2 个树孩子</text>
<line x1="880" y1="210" x2="740" y2="355" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<line x1="880" y1="210" x2="1020" y2="355" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 6"/>
<circle cx="880" cy="210" r="25" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
<text x="880" y="217" font-size="21" fill="#64748b" text-anchor="middle" font-weight="bold">1</text>
<line x1="856" y1="186" x2="904" y2="234" stroke="#dc2626" stroke-width="3"/>
<line x1="856" y1="234" x2="904" y2="186" stroke="#dc2626" stroke-width="3"/>
<circle cx="740" cy="355" r="25" fill="white" stroke="#1d4ed8" stroke-width="3"/>
<text x="740" y="362" font-size="21" fill="#1d4ed8" text-anchor="middle" font-weight="bold">2</text>
<circle cx="1020" cy="355" r="25" fill="white" stroke="#c2410c" stroke-width="3"/>
<text x="1020" y="362" font-size="21" fill="#c2410c" text-anchor="middle" font-weight="bold">3</text>
<text x="625" y="420" font-size="17" fill="#172554" text-anchor="start" font-weight="normal">删除前的 DFS：1 → 2，返回，再 1 → 3</text>
<text x="625" y="458" font-size="19" fill="#172554" text-anchor="start" font-weight="normal">删除 1 后，2 与 3 各成一块</text>
<text x="625" y="489" font-size="19" fill="#c2410c" text-anchor="start" font-weight="normal">child[1] = 2，是割点</text>
<rect x="25" y="530" width="1130" height="70" rx="8" fill="#eff6ff" stroke="none"/>
<text x="42" y="558" font-size="18" fill="#172554" text-anchor="start" font-weight="bold">root 没有“父亲方向”的剩余节点，因此不能照搬非根的 &gt;= 条件。</text>
<text x="42" y="585" font-size="17" fill="#172554" text-anchor="start" font-weight="normal">只有发现一个新的 DFS 树孩子，child 才加 1；回连边、重边、自环都不额外产生孩子。</text>
</g></svg>
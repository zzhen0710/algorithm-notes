ext><text x="661" y="244" font-size="20" fill="#166534" text-anchor="start" font-weight="bold">LCA = 3</text><path d="M300 584 V352" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/><path d="M930 584 V352" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/><text x="35" y="405" font-size="18" fill="#9a3412" text-anchor="start" font-weight="bold">9 → 5：跳 4 步</text><text x="953" y="405" font-size="18" fill="#9a3412" text-anchor="start" font-weight="bold">15 → 11：跳 4 步</text><text x="35" y="640" font-size="20" fill="#172b4d" text-anchor="start" font-weight="bold">8 步：祖先都为 1，跳过；4 步：到 5、11，执行。</text><text x="35" y="685" font-size="20" fill="#172b4d" text-anchor="start" font-weight="bold">2 步：祖先都为 3，跳过；1 步：到 4、10，执行。</text><text x="35" y="733" font-size="22" fill="#166534" text-anchor="start" font-weight="bold">最终两点仍不同，但父亲相同：返回父亲 3。</text><text x="35" y="773" font-size="18" fill="#172b4d" text-anchor="start">“跳过”表示本档不移动，继续尝试更小步长，不表示结束查询。</text></g></svg>

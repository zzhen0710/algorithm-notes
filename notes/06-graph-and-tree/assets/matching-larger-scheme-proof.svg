<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1020" viewBox="0 0 1120 1020" role="img" aria-labelledby="title desc">
<title id="title">更大的匹配为什么必然暴露一条增广路</title>
<desc id="desc">当前方案四对，另一方案五对。去掉共有的L1-R1，两种颜色的边组成一个交替环和一条交替路径。环上蓝橙各两条；路径L4-R4-L5-R5上橙两条蓝一条，两端在当前方案中空闲，因而是一条增广路。</desc>
<rect width="1120" height="1020" rx="16" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1e293b">
<text x="26" y="36" font-size="23" font-weight="700" fill="#1e293b" text-anchor="start">为什么“存在更大方案”就意味着存在增广路？</text>
<line x1="30" y1="73" x2="76" y2="73" stroke="#2563eb" stroke-width="4"/>
<text x="88" y="79" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">蓝色：仅当前方案选中</text>
<line x1="380" y1="73" x2="426" y2="73" stroke="#c56812" stroke-width="4"/>
<text x="438" y="79" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">橙色：仅另一方案选中</text>
<line x1="750" y1="73" x2="796" y2="73" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
<text x="808" y="79" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">灰色虚线：两者共有</text>
<rect x="24" y="105" width="514" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="572" y="105" width="524" height="390" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="42" y="138" font-size="20" font-weight="700" fill="#2563eb" text-anchor="start">① 当前方案：4 对</text>
<text x="590" y="138" font-size="20" font-weight="700" fill="#c56812" text-anchor="start">假设存在的另一方案：5 对</text>
<text x="42" y="166" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start">每幅图只画该方案选中的边。</text>
<text x="590" y="166" font-size="15" font-weight="400" fill="#1e293b" text-anchor="start">使用同一批左点和右点。</text>
<line x1="110" y1="212" x2="440" y2="212" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
<line x1="110" y1="271" x2="440" y2="271" stroke="#2563eb" stroke-width="4"/>
<line x1="110" y1="330" x2="440" y2="330" stroke="#2563eb" stroke-width="4"/>
<line x1="110" y1="448" x2="440" y2="389" stroke="#2563eb" stroke-width="4"/>
<circle cx="110" cy="212" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="110" y="218" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L1</text>
<circle cx="440" cy="212" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="440" y="218" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R1</text>
<circle cx="110" cy="271" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="110" y="277" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L2</text>
<circle cx="440" cy="271" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="440" y="277" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R2</text>
<circle cx="110" cy="330" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="110" y="336" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L3</text>
<circle cx="440" cy="330" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="440" y="336" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R3</text>
<circle cx="110" cy="389" r="23" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="110" y="395" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L4</text>
<circle cx="440" cy="389" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="440" y="395" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R4</text>
<circle cx="110" cy="448" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="110" y="454" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L5</text>
<circle cx="440" cy="448" r="23" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="440" y="454" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R5</text>
<line x1="658" y1="212" x2="988" y2="212" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 6"/>
<line x1="658" y1="271" x2="988" y2="330" stroke="#c56812" stroke-width="4"/>
<line x1="658" y1="330" x2="988" y2="271" stroke="#c56812" stroke-width="4"/>
<line x1="658" y1="389" x2="988" y2="389" stroke="#c56812" stroke-width="4"/>
<line x1="658" y1="448" x2="988" y2="448" stroke="#c56812" stroke-width="4"/>
<circle cx="658" cy="212" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="658" y="218" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L1</text>
<circle cx="988" cy="212" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="988" y="218" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R1</text>
<circle cx="658" cy="271" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="658" y="277" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L2</text>
<circle cx="988" cy="271" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="988" y="277" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R2</text>
<circle cx="658" cy="330" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="658" y="336" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L3</text>
<circle cx="988" cy="330" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="988" y="336" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R3</text>
<circle cx="658" cy="389" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="658" y="395" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L4</text>
<circle cx="988" cy="389" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="988" y="395" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R4</text>
<circle cx="658" cy="448" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="658" y="454" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L5</text>
<circle cx="988" cy="448" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="988" y="454" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R5</text>
<text x="26" y="536" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">② 两边都去掉共有边 L1-R1：各减 1 对，数量仍相差 1</text>
<text x="26" y="564" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">把剩下的蓝边、橙边画到同一张图，再按连通部分分开看：</text>
<rect x="24" y="586" width="464" height="254" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="510" y="586" width="586" height="254" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
<text x="42" y="617" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">交替环：两种边一样多</text>
<text x="528" y="617" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">交替路径：橙边比蓝边多 1 条</text>
<line x1="105" y1="666" x2="400" y2="666" stroke="#2563eb" stroke-width="4"/>
<line x1="105" y1="770" x2="400" y2="770" stroke="#2563eb" stroke-width="4"/>
<line x1="105" y1="666" x2="400" y2="770" stroke="#c56812" stroke-width="4"/>
<line x1="105" y1="770" x2="400" y2="666" stroke="#c56812" stroke-width="4"/>
<circle cx="105" cy="666" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="105" y="672" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L2</text>
<circle cx="400" cy="666" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="400" y="672" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R2</text>
<circle cx="105" cy="770" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="105" y="776" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L3</text>
<circle cx="400" cy="770" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="400" y="776" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R3</text>
<text x="256" y="822" font-size="16" font-weight="400" fill="#1e293b" text-anchor="middle">蓝 2 条，橙 2 条：数量差为 0</text>
<line x1="560" y1="718" x2="720" y2="718" stroke="#c56812" stroke-width="4"/>
<line x1="720" y1="718" x2="880" y2="718" stroke="#2563eb" stroke-width="4"/>
<line x1="880" y1="718" x2="1040" y2="718" stroke="#c56812" stroke-width="4"/>
<circle cx="560" cy="718" r="23" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="560" y="724" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L4</text>
<circle cx="720" cy="718" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="720" y="724" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R4</text>
<circle cx="880" cy="718" r="23" fill="#ffffff" stroke="#64748b" stroke-width="1.7"/>
<text x="880" y="724" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">L5</text>
<circle cx="1040" cy="718" r="23" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text x="1040" y="724" font-size="16" font-weight="700" fill="#1e293b" text-anchor="middle">R5</text>
<text x="560" y="674" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">当前空闲</text>
<text x="1040" y="674" font-size="15" font-weight="700" fill="#047857" text-anchor="middle">当前空闲</text>
<text x="640" y="762" font-size="15" font-weight="400" fill="#c56812" text-anchor="middle">未选边</text>
<text x="800" y="762" font-size="15" font-weight="400" fill="#2563eb" text-anchor="middle">当前已选边</text>
<text x="960" y="762" font-size="15" font-weight="400" fill="#c56812" text-anchor="middle">未选边</text>
<text x="803" y="822" font-size="16" font-weight="400" fill="#1e293b" text-anchor="middle">蓝 1 条，橙 2 条：数量差为 1</text>
<rect x="24" y="863" width="1072" height="133" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
<text x="43" y="896" font-size="20" font-weight="700" fill="#047857" text-anchor="start">③ 当前方案沿这条路径翻转：去掉 1 条蓝边，加入 2 条橙边</text>
<text x="43" y="932" font-size="18" font-weight="400" fill="#1e293b" text-anchor="start">原来：L5-R4。改为：L4-R4 与 L5-R5。内部点换搭档，两端也配上。</text>
<text x="43" y="970" font-size="18" font-weight="700" fill="#047857" text-anchor="start">因此从 4 对变成 5 对。这条能多配一对的交替路径，就是增广路。</text>
</g></svg>
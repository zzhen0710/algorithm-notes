<text x="36" y="832" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#0f172a" font-weight="400">例如 e4：2→5，最早在 3 开始，最迟在 8−2=6 开始，单独延期上限为 3。</text>
<text x="36" y="870" font-family="Microsoft YaHei, sans-serif" font-size="18" fill="#dc2626" font-weight="700">余量不是每条边可同时各用一遍的额外时间；同一分支上的活动可能共享它。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="415" viewBox="0 0 1220 415"><rect width="1220" height="415" rx="16" fill="#f8fafc"/><g font-family="Microsoft YaHei, sans-serif"><text x="32" y="42" font-size="25" fill="#172b4d" text-anchor="start" font-weight="bold">三个数组协作：先找位置，再找节点</text><text x="32" y="78" font-size="18" fill="#172b4d" text-anchor="start">CF 1006E 例子：子树 3 包含节点 3、5、6、8、7、9，区间为 [3,8]。</text><rect x="57" y="111" width="109" height="64" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="111" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">1</text><text x="111" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 1</text><rect x="186" y="111" width="109" height="64" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="240" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">2</text><text x="240" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 2</text><rect x="315" y="111" width="109" height="64" rx="8" fill="#bbf7d0" stroke="#64748b"/><text x="369" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">3</text><text x="369" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 3</text><rect x="444" y="111" width="109" height="64" rx="8" fill="#bbf7d0" stroke="#64748b"/><text x="498" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">5</text><text x="498" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 4</text><rect x="573" y="111" width="109" height="64" rx="8" fill="#bbf7d0" stroke="#64748b"/><text x="627" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">6</text><text x="627" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 5</text><rect x="702" y="111" width="109" height="64" rx="8" fill="#bbf7d0" stroke="#64748b"/><rect x="699" y="108" width="115" height="70" rx="9" fill="none" stroke="#ea580c" stroke-width="3"/><text x="756" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">8</text><text x="756" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 6</text><rect x="831" y="111" width="109" height="64" rx="8" fill="#bbf7d0" stroke="#64748b"/><text x="885" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">7</text><text x="885" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 7</text><rect x="960" y="111" width="109" height="64" rx="8" fill="#bbf7d0" stroke="#64748b"/><text x="1014" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">9</text><text x="1014" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 8</text><rect x="1089" y="111" width="109" height="64" rx="8" fill="#dbeafe" stroke="#64748b"/><text x="1143" y="153" font-size="25" fill="#172b4d" text-anchor="middle" font-weight="bold">4</text><text x="1143" y="205" font-size="17" fill="#172b4d" text-anchor="middle">位置 9</text><path d="M315 216 V229 H1069 V216" stroke="#16a34a" stroke-width="3" fill="none"/><text x="692" y="260" font-size="20" fill="#166534" text-anchor="middle" font-weight="bold">tin[3]=3                             tout[3]=8</text><text x="32" y="309" font-size="21" fill="#172b4d" text-anchor="start" font-weight="bold">查询 u=3、k=4：tin[3]=3 → 向后移 3 步 → pos=6 ≤ tout[3] → order[6]=8</text><text x="32" y="353" font-size="19" fill="#172b4d" text-anchor="start">反向映射：tin[5]=4，order[4]=5。节点编号和序列位置要分开。</text><text x="32" y="389" font-size="19" fill="#b45309" text-anchor="start">若 k=7，则 pos=9，虽然数组里有第 9 项，但已经越过子树右边界。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">负边改善距离后，同一条边需要重新传播</title>
<desc id="desc">有向边1到2权2、1到3权5、3到2权负10、2到4权1。先由2到4得到距离3，后来经3把到2距离改善为负5，必须再次处理2到4，得到负4。图没有环。</desc>
<defs>
<marker id="blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2775ae"/></marker>
<marker id="orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#b95f19"/></marker>
</defs>
<rect width="1040" height="570" rx="14" fill="#fff"/>
<g font-family="Microsoft YaHei,Arial,sans-serif" fill="#1d3345">
<text x="32" y="40" font-size="25" font-weight="700">负边改善距离后，同一条边需要重新传播</text>
<text x="32" y="72" font-size="17" fill="#586e80">有向无环图 · 起点 1 · 按堆中距离从小到大取出</text>
<rect x="24" y="94" width="992" height="291" rx="12" fill="#f6f9fc" stroke="#c3d3df"/>
<g fill="none" stroke="#2775ae" stroke-width="3" marker-end="url(#blue)">
<path d="M137,210 L486,160"/>
<path d="M130,235 L281,314"/>
<path d="M554,155 L855,155"/>
</g>
<path d="M335,307 L499,183" fill="none" stroke="#b95f19" stroke-width="3" marker-end="url(#orange)"/>
<g fill="#fff" stroke="#2775ae" stroke-width="2.5">
<circle cx="105" cy="215" r="33"/><circle cx="520" cy="155" r="33"/>
<circle cx="310" cy="330" r="33"/><circle cx="890" cy="155" r="33"/>
</g>
<g text-anchor="middle" font-size="25" font-weight="700">
<text x="105" y="224">1</text><text x="520" y="164">2</text>
<text x="310" y="339">3</text><text x="890" y="164">4</text>
</g>
<g text-anchor="middle" font-size="21" font-weight="700">
<text x="304" y="166">2</text><text x="192" y="292">5</text>
<text x="442" y="276" fill="#b95f19">−10</text><text x="710" y="137">1</text>
</g>
<g text-anchor="middle" font-size="17" fill="#586e80">
<text x="105" y="272">起点</text>
<text x="520" y="115">dist[2]：2 → −5</text>
<text x="890" y="211">dist[4]：3 → −4</text>
<text x="710" y="252" fill="#b95f19" font-weight="700">边权仍是 1，起点距离变了</text>
<text x="710" y="281">只处理一次，就会漏掉第二次更新</text>
</g>
<rect x="24" y="407" width="310" height="106" rx="10" fill="#edf5fb" stroke="#c3d3df"/>
<rect x="365" y="407" width="310" height="106" rx="10" fill="#fff4e9" stroke="#e0c2a4"/>
<rect x="706" y="407" width="310" height="106" rx="10" fill="#eaf7ef" stroke="#b7d7c1"/>
<g font-size="19" font-weight="700">
<text x="44" y="441">① 先处理 2→4</text><text x="385" y="441">② 再经 1→3→2</text><text x="726" y="441">③ 重新处理 2→4</text>
</g>
<g font-size="21">
<text x="44" y="482">dist[4] = 2 + 1 = 3</text><text x="385" y="482">dist[2] = 5 − 10 = −5</text><text x="726" y="482">dist[4] = −5 + 1 = −4</text>
</g>
<text x="32" y="550" font-size="18" font-weight="700">需要再次传播的是“改善后的距离”，不是修改边权，也不是绕负环。</text>
</g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="900" viewBox="0 0 1140 900" role="img" aria-labelledby="title desc">
<title id="title">单调栈：相等不结算，更大值到来后连续弹栈</title>
<desc id="desc">数组2、1、2、4、3，0基下标。处理下标2值2时，弹出下标1并令答案1等于2，相等的下标0不弹，栈成为0、2。处理下标3值4时，先弹2再弹0，两者的答案均为3，然后将3入栈。处理下标4值3后，栈内3、4仍等待答案，扫描结束后均保留负1。</desc>
<rect width="1140" height="900" fill="#f8fafc"/>
<text x="30" y="46" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" fill="#172554" font-weight="700" text-anchor="start">单调栈：新位置到来，为旧位置确定答案</text>
<text x="30" y="83" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">求右侧第一个严格更大元素；栈内存下标，下面同时标出对应值。</text>
<text x="54" y="145" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#172554" font-weight="700" text-anchor="start">原数组 a</text>
<text x="335" y="119" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">0</text>
<rect x="289" y="128" width="92" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="335" y="164" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="28" fill="#172554" font-weight="700" text-anchor="middle">2</text>
<text x="475" y="119" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">1</text>
<rect x="429" y="128" width="92" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="475" y="164" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="28" fill="#172554" font-weight="700" text-anchor="middle">1</text>
<text x="615" y="119" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">2</text>
<rect x="569" y="128" width="92" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="615" y="164" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="28" fill="#172554" font-weight="700" text-anchor="middle">2</text>
<text x="755" y="119" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">3</text>
<rect x="709" y="128" width="92" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="755" y="164" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="28" fill="#172554" font-weight="700" text-anchor="middle">4</text>
<text x="895" y="119" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">4</text>
<rect x="849" y="128" width="92" height="52" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="895" y="164" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="28" fill="#172554" font-weight="700" text-anchor="middle">3</text>
<text x="310" y="211" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">栈底 → 栈顶</text>
<rect x="24" y="230" width="1092" height="180" rx="10" fill="#fff" stroke="#cbd5e1"/>
<rect x="24" y="430" width="1092" height="180" rx="10" fill="#fff" stroke="#cbd5e1"/>
<rect x="24" y="630" width="1092" height="180" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="44" y="265" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">① 当前 i=2</text>
<rect x="280" y="272" width="104" height="60" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="332" y="296" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 0</text>
<text x="332" y="321" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<rect x="400" y="272" width="104" height="60" rx="10" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="452" y="296" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 1</text>
<text x="452" y="321" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 1</text>
<text x="596" y="275" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#9a3412" font-weight="400" text-anchor="middle">新值</text>
<rect x="544" y="286" width="104" height="60" rx="10" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="596" y="310" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 2</text>
<text x="596" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<text x="695" y="322" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" fill="#64748b" font-weight="400" text-anchor="middle">→</text>
<rect x="766" y="286" width="104" height="60" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="818" y="310" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 0</text>
<text x="818" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<rect x="886" y="286" width="104" height="60" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="938" y="310" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 2</text>
<text x="938" y="335" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<text x="280" y="373" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#1d4ed8" font-weight="400" text-anchor="start">弹出下标 1：ans[1]=2；下标 0 的值相等，保留，再压入 2。</text>
<text x="280" y="398" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">只有旧值 &lt; 新值才结算；相等元素不能互相作为答案。</text>
<text x="44" y="465" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">② 当前 i=3</text>
<rect x="280" y="472" width="104" height="60" rx="10" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="332" y="496" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 0</text>
<text x="332" y="521" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<rect x="400" y="472" width="104" height="60" rx="10" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="452" y="496" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 2</text>
<text x="452" y="521" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<text x="596" y="475" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#9a3412" font-weight="400" text-anchor="middle">新值</text>
<rect x="544" y="486" width="104" height="60" rx="10" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="596" y="510" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 3</text>
<text x="596" y="535" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 4</text>
<text x="695" y="522" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" fill="#64748b" font-weight="400" text-anchor="middle">→</text>
<rect x="826" y="486" width="104" height="60" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="878" y="510" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 3</text>
<text x="878" y="535" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 4</text>
<text x="280" y="573" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#1d4ed8" font-weight="400" text-anchor="start">先弹 2，再弹 0：ans[2]=3，ans[0]=3。</text>
<text x="280" y="598" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">同一个新位置可以连续结算多个旧位置，所以需要 while。</text>
<text x="44" y="665" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">③ 扫描结束</text>
<rect x="280" y="688" width="104" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="332" y="712" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 3</text>
<text x="332" y="737" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 4</text>
<rect x="400" y="688" width="104" height="60" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
<text x="452" y="712" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 4</text>
<text x="452" y="737" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 3</text>
<text x="578" y="712" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">处理 i=4 后，3、4 都仍未找到答案。</text>
<text x="578" y="746" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#334155" font-weight="400" text-anchor="start">没有未来元素了：保留 ans[3]=ans[4]=-1。</text>
<text x="280" y="795" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#475569" font-weight="400" text-anchor="start">栈里是尚未解决的位置；已解决的位置不会再次入栈。</text>
<text x="32" y="858" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#172554" font-weight="700" text-anchor="start">最终答案下标： [3, 2, 3, -1, -1]</text>
</svg>

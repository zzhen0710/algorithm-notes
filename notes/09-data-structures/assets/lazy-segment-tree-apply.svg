<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="605" viewBox="0 0 1120 605" role="img" aria-labelledby="title desc">
<title id="title">整段加 3：本段先更新，孩子暂不展开</title><desc id="desc">数组1到8，对1到4加3。根总和48，左段总和22，待下传3；其两孩子仍为3和7，尚未接收修改。</desc>
<rect width="1120" height="605" rx="16" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1e293b">
<text x="24" y="38" font-size="25" font-weight="700">整段加 3：本段先更新，孩子暂不展开</text>
<text x="24" y="75" font-size="19" fill="#334155" font-weight="400">原数组：1  2  3  4  5  6  7  8     修改：[1,4] 每项 +3</text>
<line x1="560" y1="201" x2="330" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="201" x2="860" y2="251" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="330" y1="344" x2="175" y2="413" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="330" y1="344" x2="475" y2="413" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430.0" y="108" width="260" height="93" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="560" y="133" text-anchor="middle" font-size="18" font-weight="400">p=1  [1,8]</text>
<text x="560" y="162" text-anchor="middle" font-size="23" font-weight="700">sum = 48</text>
<text x="560" y="188" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<rect x="197.5" y="251" width="265" height="93" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="330" y="276" text-anchor="middle" font-size="18" font-weight="400">p=2  [1,4]</text>
<text x="330" y="305" text-anchor="middle" font-size="23" font-weight="700">sum = 22</text>
<text x="330" y="331" text-anchor="middle" font-size="19" font-weight="400">lazy = 3</text>
<rect x="727.5" y="251" width="265" height="93" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="860" y="276" text-anchor="middle" font-size="18" font-weight="400">p=3  [5,8]</text>
<text x="860" y="305" text-anchor="middle" font-size="23" font-weight="700">sum = 26</text>
<text x="860" y="331" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<rect x="57.5" y="413" width="235" height="93" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="175" y="438" text-anchor="middle" font-size="18" font-weight="400">p=4  [1,2]</text>
<text x="175" y="467" text-anchor="middle" font-size="23" font-weight="700">sum = 3</text>
<text x="175" y="493" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<rect x="357.5" y="413" width="235" height="93" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="475" y="438" text-anchor="middle" font-size="18" font-weight="400">p=5  [3,4]</text>
<text x="475" y="467" text-anchor="middle" font-size="23" font-weight="700">sum = 7</text>
<text x="475" y="493" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<text x="655" y="440" font-size="18" fill="#334155" font-weight="400">右侧未受这次修改影响</text>
<text x="655" y="473" font-size="18" fill="#334155" font-weight="400">其余后代省略</text>
<text x="24" y="548" font-size="20" fill="#166534" font-weight="700">本段：10 + 3 × 4 = 22；根重新合并：22 + 26 = 48。</text>
<text x="24" y="581" font-size="18" fill="#334155" font-weight="400">左段的两个孩子尚未接收 +3；lazy=3 记的是每项增量，不是总和增量。</text>
</g></svg>

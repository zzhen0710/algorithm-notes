<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="395" viewBox="0 0 1120 395" role="img" aria-labelledby="title desc">
<title id="title">ST 建表：相邻的两个半段组成整段</title><desc id="desc">数组为7、2、6、3、9、4、8、1。长度二的区间2到3最大值六，区间4到5最大值九，合成长度四的区间2到5最大值九。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect width="1120" height="395" rx="16" fill="#f8fafc"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1e293b">
<text x="25" y="34" font-size="22" font-weight="700" fill="#1e293b" text-anchor="start">建表：先算长度 2 的两半，再合成长度 4 的整段</text>
<text x="25" y="124" font-size="16" font-weight="400" fill="#1e293b" text-anchor="start">原数组</text>
<rect x="120" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="162.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">1</text>
<text x="162.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">7</text>
<rect x="225" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="267.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">2</text>
<text x="267.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">2</text>
<rect x="330" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="372.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">3</text>
<text x="372.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">6</text>
<rect x="435" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="477.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">4</text>
<text x="477.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">3</text>
<rect x="540" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="582.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">5</text>
<text x="582.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">9</text>
<rect x="645" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="687.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">6</text>
<text x="687.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">4</text>
<rect x="750" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="792.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">7</text>
<text x="792.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">8</text>
<rect x="855" y="93" width="85" height="49" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="897.5" y="83" font-size="15" font-weight="400" fill="#64748b" text-anchor="middle">8</text>
<text x="897.5" y="125" font-size="23" font-weight="700" fill="#1e293b" text-anchor="middle">1</text>
<text x="982" y="124" font-size="15" font-weight="400" fill="#64748b" text-anchor="start">上方为下标</text>
<rect x="225" y="179" width="190" height="66" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="320.0" y="206" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">st[1][2] = 6</text>
<text x="320.0" y="230" font-size="16" font-weight="400" fill="#2563eb" text-anchor="middle">对应区间 [2,3]</text>
<rect x="435" y="179" width="190" height="66" rx="7" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="530.0" y="206" font-size="18" font-weight="700" fill="#15803d" text-anchor="middle">st[1][4] = 9</text>
<text x="530.0" y="230" font-size="16" font-weight="400" fill="#15803d" text-anchor="middle">对应区间 [4,5]</text>
<line x1="320" y1="249" x2="390" y2="277" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="530" y1="249" x2="460" y2="277" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="225" y="284" width="400" height="55" rx="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="425.0" y="311" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="middle">st[2][2] = max(6,9) = 9</text>
<text x="680" y="204" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">右半段起点：2 + 2 = 4</text>
<text x="680" y="244" font-size="18" font-weight="400" fill="#1e293b" text-anchor="start">两半相邻，不重不漏。</text>
<text x="25" y="376" font-size="18" font-weight="400" fill="#1e293b" text-anchor="start">st[k][i]：从 i 开始，连续 2^k 项的最大值。</text>
</g></svg>
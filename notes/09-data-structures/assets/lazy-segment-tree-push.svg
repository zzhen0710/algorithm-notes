<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">查询 [3,6]：读取孩子前，先分发旧标记</title><desc id="desc">在左段加3之后查询3到6。左父标记清零，两孩子总和变9和13并接收标记3，返回3到4的13与5到6的11，答案24。</desc>
<rect width="1120" height="650" rx="16" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1e293b">
<text x="24" y="38" font-size="25" font-weight="700">查询 [3,6]：读取孩子前，先分发旧标记</text>
<text x="24" y="75" font-size="19" fill="#334155" font-weight="400">查询没有改变数组，只把已有修改交给需要读取的更小区间。</text>
<line x1="560" y1="201" x2="310" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="560" y1="201" x2="820" y2="255" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="310" y1="348" x2="140" y2="421" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="310" y1="348" x2="420" y2="421" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="820" y1="348" x2="700" y2="421" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="820" y1="348" x2="980" y2="421" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="430.0" y="108" width="260" height="93" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="560" y="133" text-anchor="middle" font-size="18" font-weight="400">p=1  [1,8]</text>
<text x="560" y="162" text-anchor="middle" font-size="23" font-weight="700">sum = 48</text>
<text x="560" y="188" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<rect x="180.0" y="255" width="260" height="93" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="310" y="280" text-anchor="middle" font-size="18" font-weight="400">p=2  [1,4]</text>
<text x="310" y="309" text-anchor="middle" font-size="23" font-weight="700">sum = 22</text>
<text x="310" y="335" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<rect x="690.0" y="255" width="260" height="93" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="820" y="280" text-anchor="middle" font-size="18" font-weight="400">p=3  [5,8]</text>
<text x="820" y="309" text-anchor="middle" font-size="23" font-weight="700">sum = 26</text>
<text x="820" y="335" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<rect x="35.0" y="421" width="210" height="93" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="140" y="446" text-anchor="middle" font-size="18" font-weight="400">p=4  [1,2]</text>
<text x="140" y="475" text-anchor="middle" font-size="23" font-weight="700">sum = 9</text>
<text x="140" y="501" text-anchor="middle" font-size="19" font-weight="400">lazy = 3</text>
<rect x="315.0" y="421" width="210" height="93" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="420" y="446" text-anchor="middle" font-size="18" font-weight="400">p=5  [3,4]</text>
<text x="420" y="475" text-anchor="middle" font-size="23" font-weight="700">sum = 13</text>
<text x="420" y="501" text-anchor="middle" font-size="19" font-weight="400">lazy = 3</text>
<rect x="595.0" y="421" width="210" height="93" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="700" y="446" text-anchor="middle" font-size="18" font-weight="400">p=6  [5,6]</text>
<text x="700" y="475" text-anchor="middle" font-size="23" font-weight="700">sum = 11</text>
<text x="700" y="501" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<rect x="875.0" y="421" width="210" height="93" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="980" y="446" text-anchor="middle" font-size="18" font-weight="400">p=7  [7,8]</text>
<text x="980" y="475" text-anchor="middle" font-size="23" font-weight="700">sum = 15</text>
<text x="980" y="501" text-anchor="middle" font-size="19" font-weight="400">lazy = 0</text>
<text x="465" y="285" font-size="18" fill="#1d4ed8" font-weight="400">两边都接收 +3</text>
<text x="465" y="315" font-size="18" fill="#1d4ed8" font-weight="400">父标记清零</text>
<text x="24" y="558" font-size="23" fill="#166534" font-weight="700">绿色整段直接返回：13 + 11 = 24。</text>
<text x="24" y="595" font-size="18" fill="#334155" font-weight="400">[1,2] 虽然没有被查询，也必须接收标记；不必继续访问它的叶子。</text>
<text x="24" y="628" font-size="18" fill="#334155" font-weight="400">父总和仍为 22 = 9 + 13；下传不是再给父节点加一次。</text>
</g></svg>

<text x="44" y="841" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">[1,4] + [5,6] + [7,7] = [1,7]</text>
<text x="44" y="885" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#166534" font-weight="700" text-anchor="start">10 + 7 + 6 = 23；没有重复，也没有遗漏。</text>

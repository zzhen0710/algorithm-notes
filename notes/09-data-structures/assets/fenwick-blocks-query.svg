<rect x="300" y="573" width="728" height="36" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="664.0" y="599" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#172554" font-weight="700" text-anchor="middle">24</text>
<rect x="24" y="650" width="1092" height="267" rx="8" fill="#fff" stroke="#cbd5e1"/>
<text x="44" y="690" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="start">查询 prefix_sum(7)：7 → 6 → 4 → 0</text>
<text x="44" y="731" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">执行时从右向左取块；下面按原数组顺序摆回去：</text>
<rect x="300" y="752" width="360" height="47" rx="8" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="480.0" y="784" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">bit[4] = 10</text>

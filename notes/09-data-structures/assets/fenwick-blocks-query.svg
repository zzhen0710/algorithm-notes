<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="945" viewBox="0 0 1140 945" role="img" aria-labelledby="title desc">
<title id="title">树状数组的局部区间与查询拆分</title>
<desc id="desc">1基数组2、1、3、4、5、2、6、1。bit各项依次覆盖1到1、1到2、3到3、1到4、5到5、5到6、7到7、1到8，和为2、3、3、10、5、7、6、24。查询前7项，按7、6、4、0访问，选择7到7、5到6、1到4三块，互不重叠，总和23。</desc>
<rect width="1140" height="945" fill="#f8fafc"/>
<text x="28" y="43" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" fill="#172554" font-weight="700" text-anchor="start">bit[i] 保存局部区间，查询时挑出不重叠的块</text>
<text x="28" y="83" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">a = [2,1,3,4,5,2,6,1]，1-based；每行横条的终点就是 i。</text>
<text x="30" y="120" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" fill="#64748b" font-weight="400" text-anchor="start">原数组下标</text>
<text x="30" y="162" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#172554" font-weight="700" text-anchor="start">原值 a[i]</text>

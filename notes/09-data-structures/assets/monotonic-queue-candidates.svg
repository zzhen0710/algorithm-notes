<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="960" viewBox="0 0 1140 960" role="img" aria-labelledby="title desc">
<title id="title">单调队列：按窗口左端去过期，从队尾排除劣势候选</title>
<desc id="desc">数组4、2、2、3、1、0、5，固定窗口3，0基下标。i2时旧下标1与新下标2值同为2，保留较新2，队列0、2。i3左端1，先从队首移除过期0，再从队尾移除值2不如新值3的下标2，队列只留3。i6左端4，先移除过期3，再由新值5移除尾部下标5、4，队列只留6。完整窗口的最大值依次为4、3、3、3、5。</desc>
<rect width="1140" height="960" fill="#f8fafc"/>
<text x="30" y="46" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="30" fill="#172554" font-weight="700" text-anchor="start">单调队列：两端删除，两种理由</text>
<text x="30" y="83" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">a = [4,2,2,3,1,0,5]，k = 3；每个格子同时展示候选下标与原值。</text>
<text x="330" y="118" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">0</text>
<rect x="290" y="126" width="80" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="330" y="160" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="26" fill="#172554" font-weight="700" text-anchor="middle">4</text>
<text x="432" y="118" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">1</text>
<rect x="392" y="126" width="80" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="432" y="160" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="26" fill="#172554" font-weight="700" text-anchor="middle">2</text>

<text x="534" y="160" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="26" fill="#172554" font-weight="700" text-anchor="middle">2</text>
<text x="636" y="118" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">3</text>
<rect x="596" y="126" width="80" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="636" y="160" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="26" fill="#172554" font-weight="700" text-anchor="middle">3</text>
<text x="738" y="118" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">4</text>
<rect x="698" y="126" width="80" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="738" y="160" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="26" fill="#172554" font-weight="700" text-anchor="middle">1</text>
<text x="840" y="118" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">5</text>
<rect x="800" y="126" width="80" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="840" y="160" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="26" fill="#172554" font-weight="700" text-anchor="middle">0</text>
<text x="942" y="118" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">6</text>
<rect x="902" y="126" width="80" height="48" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="942" y="160" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="26" fill="#172554" font-weight="700" text-anchor="middle">5</text>
<text x="35" y="155" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#172554" font-weight="700" text-anchor="start">原数组</text>
<text x="30" y="208" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">红色：队首过期；蓝色：队尾被替代；橙色：本轮新元素；绿色：保留候选。</text>
<rect x="24" y="230" width="1092" height="192" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="445" width="1092" height="192" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<rect x="24" y="660" width="1092" height="192" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
<text x="44" y="266" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">① i=2</text>
<text x="44" y="299" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#334155" font-weight="400" text-anchor="start">left=0</text>
<text x="310" y="261" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="start">原 q：队首 → 队尾</text>
<rect x="292" y="279" width="96" height="59" rx="10" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="340" y="302" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 0</text>
<text x="340" y="328" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 4</text>
<rect x="402" y="279" width="96" height="59" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="450" y="302" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 1</text>
<text x="450" y="328" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<text x="625" y="267" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#9a3412" font-weight="400" text-anchor="middle">新元素</text>

<text x="625" y="307" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 2</text>
<text x="625" y="333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<text x="724" y="321" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="29" fill="#64748b" font-weight="400" text-anchor="middle">→</text>
<rect x="784" y="284" width="96" height="59" rx="10" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="832" y="307" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 0</text>
<text x="832" y="333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 4</text>
<rect x="896" y="284" width="96" height="59" rx="10" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="944" y="307" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 2</text>
<text x="944" y="333" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<text x="280" y="375" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#1d4ed8" font-weight="400" text-anchor="start">值相等，保留新下标 2，删除旧下标 1；队首 0 仍有效。</text>
<text x="280" y="406" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#334155" font-weight="400" text-anchor="start">完整窗口 [0,2]，最大值 a[0]=4。</text>
<text x="44" y="481" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">② i=3</text>
<text x="44" y="514" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#334155" font-weight="400" text-anchor="start">left=1</text>
<rect x="292" y="494" width="96" height="59" rx="10" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="340" y="517" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 0</text>
<text x="340" y="543" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 4</text>
<rect x="402" y="494" width="96" height="59" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="450" y="517" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 2</text>
<text x="450" y="543" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 2</text>
<text x="625" y="482" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#9a3412" font-weight="400" text-anchor="middle">新元素</text>
<rect x="577" y="499" width="96" height="59" rx="10" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="625" y="522" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 3</text>
<text x="625" y="548" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 3</text>
<text x="724" y="536" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="29" fill="#64748b" font-weight="400" text-anchor="middle">→</text>
<rect x="840" y="499" width="96" height="59" rx="10" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="888" y="522" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 3</text>
<text x="888" y="548" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 3</text>
<text x="280" y="590" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#1d4ed8" font-weight="400" text-anchor="start">先从队首去掉过期 0，再从队尾去掉劣势 2。</text>
<text x="280" y="621" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#334155" font-weight="400" text-anchor="start">窗口 [1,3] 有 3 项，但 q 只有候选 3；最大值为 3。</text>
<text x="44" y="696" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">③ i=6</text>
<text x="44" y="729" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="20" fill="#334155" font-weight="400" text-anchor="start">left=4</text>
<rect x="282" y="709" width="96" height="59" rx="10" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="330" y="732" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 3</text>
<text x="330" y="758" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 3</text>
<rect x="392" y="709" width="96" height="59" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="440" y="732" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 4</text>
<text x="440" y="758" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 1</text>
<rect x="502" y="709" width="96" height="59" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="550" y="732" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 5</text>
<text x="550" y="758" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 0</text>
<text x="714" y="697" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#9a3412" font-weight="400" text-anchor="middle">新元素</text>
<rect x="666" y="714" width="96" height="59" rx="10" fill="#ffedd5" stroke="#cbd5e1"/>
<text x="714" y="737" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 6</text>
<text x="714" y="763" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 5</text>
<text x="830" y="751" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="29" fill="#64748b" font-weight="400" text-anchor="middle">→</text>
<rect x="910" y="714" width="96" height="59" rx="10" fill="#dcfce7" stroke="#cbd5e1"/>
<text x="958" y="737" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#475569" font-weight="400" text-anchor="middle">下标 6</text>
<text x="958" y="763" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="middle">值 5</text>
<text x="280" y="805" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#1d4ed8" font-weight="400" text-anchor="start">队首 3 过期；队尾依次删除 5、4，再加入 6。</text>
<text x="280" y="836" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#334155" font-weight="400" text-anchor="start">窗口 [4,6] 的最大值为 a[6]=5。</text>
<text x="32" y="903" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="24" fill="#172554" font-weight="700" text-anchor="start">最大值下标： [0,3,3,3,6]</text>
<text x="32" y="941" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="24" fill="#172554" font-weight="700" text-anchor="start">最大值数值： [4,3,3,3,5]</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="645" viewBox="0 0 1340 645" role="img" aria-labelledby="title desc">
<title id="title">节点是前缀：路径共享，经过与结束分别计数</title><desc id="desc">依次插入app apple apt app bat，根0。app节点pass3/end2，ap节点pass4/end0，非叶节点app也是完整单词。</desc>
<rect width="1340" height="645" rx="16" fill="#f8fafc"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" fill="#1e293b">
<text x="24" y="38" font-size="25" font-weight="700">节点是前缀：路径共享，经过与结束分别计数</text>
<line x1="185" y1="292" x2="240" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="199.5" y="210.0" width="26" height="31" fill="#f8fafc"/><text x="212.5" y="233.0" text-anchor="middle" font-size="24">a</text>
<line x1="410" y1="162" x2="465" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424.5" y="145.0" width="26" height="31" fill="#f8fafc"/><text x="437.5" y="168.0" text-anchor="middle" font-size="24">p</text>
<line x1="635" y1="162" x2="690" y2="107" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="649.5" y="117.5" width="26" height="31" fill="#f8fafc"/><text x="662.5" y="140.5" text-anchor="middle" font-size="24">p</text>
<line x1="860" y1="107" x2="915" y2="107" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="874.5" y="90.0" width="26" height="31" fill="#f8fafc"/><text x="887.5" y="113.0" text-anchor="middle" font-size="24">l</text>
<line x1="1085" y1="107" x2="1140" y2="107" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1099.5" y="90.0" width="26" height="31" fill="#f8fafc"/><text x="1112.5" y="113.0" text-anchor="middle" font-size="24">e</text>
<line x1="635" y1="162" x2="690" y2="317" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="649.5" y="222.5" width="26" height="31" fill="#f8fafc"/><text x="662.5" y="245.5" text-anchor="middle" font-size="24">t</text>
<line x1="185" y1="292" x2="240" y2="477" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="199.5" y="367.5" width="26" height="31" fill="#f8fafc"/><text x="212.5" y="390.5" text-anchor="middle" font-size="24">b</text>
<line x1="410" y1="477" x2="465" y2="477" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="424.5" y="460.0" width="26" height="31" fill="#f8fafc"/><text x="437.5" y="483.0" text-anchor="middle" font-size="24">a</text>
<line x1="635" y1="477" x2="690" y2="477" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="649.5" y="460.0" width="26" height="31" fill="#f8fafc"/><text x="662.5" y="483.0" text-anchor="middle" font-size="24">t</text>
<rect x="15.0" y="245" width="170" height="94" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
<text x="100" y="270" text-anchor="middle" font-size="18" font-weight="700">u=0  空前缀</text>
<text x="100" y="300" text-anchor="middle" font-size="22" font-weight="400">pass = 5</text>
<text x="100" y="327" text-anchor="middle" font-size="22" font-weight="700">end = 0</text>
<rect x="240.0" y="115" width="170" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="325" y="140" text-anchor="middle" font-size="18" font-weight="700">u=1  a</text>
<text x="325" y="170" text-anchor="middle" font-size="22" font-weight="400">pass = 4</text>
<text x="325" y="197" text-anchor="middle" font-size="22" font-weight="700">end = 0</text>
<rect x="465.0" y="115" width="170" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="550" y="140" text-anchor="middle" font-size="18" font-weight="700">u=2  ap</text>
<text x="550" y="170" text-anchor="middle" font-size="22" font-weight="400">pass = 4</text>
<text x="550" y="197" text-anchor="middle" font-size="22" font-weight="700">end = 0</text>
<rect x="690.0" y="60" width="170" height="94" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="775" y="85" text-anchor="middle" font-size="18" font-weight="700">u=3  app</text>
<text x="775" y="115" text-anchor="middle" font-size="22" font-weight="400">pass = 3</text>
<text x="775" y="142" text-anchor="middle" font-size="22" font-weight="700">end = 2</text>
<rect x="915.0" y="60" width="170" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="1000" y="85" text-anchor="middle" font-size="18" font-weight="700">u=4  appl</text>
<text x="1000" y="115" text-anchor="middle" font-size="22" font-weight="400">pass = 1</text>
<text x="1000" y="142" text-anchor="middle" font-size="22" font-weight="700">end = 0</text>
<rect x="1140.0" y="60" width="170" height="94" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="1225" y="85" text-anchor="middle" font-size="18" font-weight="700">u=5  apple</text>
<text x="1225" y="115" text-anchor="middle" font-size="22" font-weight="400">pass = 1</text>
<text x="1225" y="142" text-anchor="middle" font-size="22" font-weight="700">end = 1</text>
<rect x="690.0" y="270" width="170" height="94" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="775" y="295" text-anchor="middle" font-size="18" font-weight="700">u=6  apt</text>
<text x="775" y="325" text-anchor="middle" font-size="22" font-weight="400">pass = 1</text>
<text x="775" y="352" text-anchor="middle" font-size="22" font-weight="700">end = 1</text>
<rect x="240.0" y="430" width="170" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="325" y="455" text-anchor="middle" font-size="18" font-weight="700">u=7  b</text>
<text x="325" y="485" text-anchor="middle" font-size="22" font-weight="400">pass = 1</text>
<text x="325" y="512" text-anchor="middle" font-size="22" font-weight="700">end = 0</text>
<rect x="465.0" y="430" width="170" height="94" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="550" y="455" text-anchor="middle" font-size="18" font-weight="700">u=8  ba</text>
<text x="550" y="485" text-anchor="middle" font-size="22" font-weight="400">pass = 1</text>
<text x="550" y="512" text-anchor="middle" font-size="22" font-weight="700">end = 0</text>
<rect x="690.0" y="430" width="170" height="94" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="775" y="455" text-anchor="middle" font-size="18" font-weight="700">u=9  bat</text>
<text x="775" y="485" text-anchor="middle" font-size="22" font-weight="400">pass = 1</text>
<text x="775" y="512" text-anchor="middle" font-size="22" font-weight="700">end = 1</text>
<text x="24" y="576" font-size="21" fill="#334155">插入顺序：app → apple → apt → app → bat；重复 app 不另建一条路径。</text>
<text x="24" y="617" font-size="21" fill="#166534">绿色：end &gt; 0，存在完整单词；蓝色：只有前缀。app 有孩子，也可以是完整单词。</text>
</g></svg>

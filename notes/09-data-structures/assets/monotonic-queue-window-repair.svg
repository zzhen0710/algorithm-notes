<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="850" viewBox="0 0 1120 850" role="img" aria-labelledby="title desc">
<title id="title">双单调队列：窗口左端不同于最值候选的队首</title>
<desc id="desc">高度3、1、2、5，允许差值3，0基下标。加入r3后，最小值候选为1、2、3，最大值候选仅3。窗口0到3差4不合法。移走位置0，两个队首都不变。再移走最小值位置1，左端到2，新最小值2，差为3合法。只有候选离开窗口时才弹出队首，窗口边界由l和r决定。</desc>
<rect width="1120" height="850" fill="#f8fafc"/>
<text x="28" y="45" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="28" fill="#172554" font-weight="700" text-anchor="start">先加入新值，再修复窗口：l 决定移走谁，队列跟随更新</text>
<text x="28" y="83" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">h = [3,1,2,5]；k = 3 是高度差上限。格子上方是原数组下标。</text>
<rect x="24" y="113" width="1072" height="211" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="43" y="146" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">① 新位置 3 加入两队列，检查扩展后的窗口</text>
<text x="365" y="171" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">0</text>
<rect x="329" y="180" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="365" y="213" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">3</text>
<text x="459" y="171" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">1</text>
<rect x="423" y="180" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="459" y="213" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">1</text>
<text x="553" y="171" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">2</text>
<rect x="517" y="180" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="553" y="213" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">2</text>
<text x="647" y="171" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">3</text>
<rect x="611" y="180" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="647" y="213" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">5</text>
<text x="43" y="202" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#334155" font-weight="400" text-anchor="start">l = 0，r = 3</text>
<text x="43" y="239" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">真实窗口 [0,3]</text>
<text x="750" y="191" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#166534" font-weight="400" text-anchor="start">最小值候选 qi：[1,2,3]</text>
<text x="750" y="225" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#1d4ed8" font-weight="400" text-anchor="start">最大值候选 qx：[3]</text>
<text x="750" y="262" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#9a3412" font-weight="700" text-anchor="start">5 − 1 = 4 &gt; 3</text>
<text x="43" y="300" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">最值位置分别是 1、3，窗口左端却是 0；队首不是窗口左端。</text>
<rect x="24" y="340" width="1072" height="211" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="43" y="373" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">② 窗口不合法，先移走位置 0，再令 l = 1</text>
<text x="365" y="398" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">0</text>
<rect x="329" y="407" width="72" height="48" rx="10" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="365" y="440" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">3</text>
<text x="459" y="398" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">1</text>
<rect x="423" y="407" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="459" y="440" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">1</text>
<text x="553" y="398" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">2</text>
<rect x="517" y="407" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="553" y="440" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">2</text>
<text x="647" y="398" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">3</text>
<rect x="611" y="407" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="647" y="440" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">5</text>
<text x="43" y="429" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#334155" font-weight="400" text-anchor="start">l = 1，r = 3</text>
<text x="43" y="466" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">真实窗口 [1,3]</text>
<text x="750" y="418" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#166534" font-weight="400" text-anchor="start">最小值候选 qi：[1,2,3]</text>
<text x="750" y="452" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#1d4ed8" font-weight="400" text-anchor="start">最大值候选 qx：[3]</text>
<text x="750" y="489" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#9a3412" font-weight="700" text-anchor="start">5 − 1 = 4 &gt; 3</text>
<text x="43" y="527" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">位置 0 不是任何队首：只移动左边界，候选与最值都不变。</text>
<rect x="24" y="567" width="1072" height="211" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="43" y="600" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="23" fill="#172554" font-weight="700" text-anchor="start">③ 仍不合法，移走位置 1，再令 l = 2</text>
<text x="365" y="625" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">0</text>
<rect x="329" y="634" width="72" height="48" rx="10" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="365" y="667" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">3</text>
<text x="459" y="625" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">1</text>
<rect x="423" y="634" width="72" height="48" rx="10" fill="#fee2e2" stroke="#cbd5e1"/>
<text x="459" y="667" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">1</text>
<text x="553" y="625" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">2</text>
<rect x="517" y="634" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="553" y="667" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">2</text>
<text x="647" y="625" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="17" fill="#64748b" font-weight="400" text-anchor="middle">3</text>
<rect x="611" y="634" width="72" height="48" rx="10" fill="#dbeafe" stroke="#cbd5e1"/>
<text x="647" y="667" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="25" fill="#172554" font-weight="700" text-anchor="middle">5</text>
<text x="43" y="656" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#334155" font-weight="400" text-anchor="start">l = 2，r = 3</text>
<text x="43" y="693" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">真实窗口 [2,3]</text>
<text x="750" y="645" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#166534" font-weight="400" text-anchor="start">最小值候选 qi：[2,3]</text>
<text x="750" y="679" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="19" fill="#1d4ed8" font-weight="400" text-anchor="start">最大值候选 qx：[3]</text>
<text x="750" y="716" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="21" fill="#9a3412" font-weight="700" text-anchor="start">5 − 2 = 3 ≤ 3</text>
<text x="43" y="754" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="20" fill="#334155" font-weight="400" text-anchor="start">位置 1 恰为 qi 队首，弹出后由位置 2 接替；窗口合法，停止收缩。</text>
<text x="28" y="820" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif" font-size="22" fill="#172554" font-weight="700" text-anchor="start">先确定合法窗口，再计算长度 r − l + 1；当前队列长度不能代替窗口长度。</text>
</svg>

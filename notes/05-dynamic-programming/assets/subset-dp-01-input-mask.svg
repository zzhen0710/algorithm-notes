<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" role="img"><title>一个四点例子：用二进制记录集合</title><desc>地点为 0..3，起点是 0；表格每行是出发点，每列是到达点。本例不要求回到起点。</desc>
<rect x="0" y="0" width="1240" height="590" rx="0" fill="#f6f8fc" stroke="none"/>
<text x="30" y="43" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" fill="#182d43" font-weight="700" text-anchor="start">一个四点例子：用二进制记录集合</text>
<text x="30" y="80" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#50677d" font-weight="400" text-anchor="start">地点为 0..3，起点是 0；表格每行是出发点，每列是到达点。本例不要求回到起点。</text>
<text x="40" y="130" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#182d43" font-weight="700" text-anchor="start">直接花费 w[u][v]</text>

<text x="280" y="285" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#50677d" font-weight="400" text-anchor="middle">0</text>
<rect x="324" y="253" width="88" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="368" y="285" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#182d43" font-weight="400" text-anchor="middle">2</text>

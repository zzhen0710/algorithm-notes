<text x="456" y="189" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="middle">3</text>
<rect x="60" y="205" width="88" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="104" y="237" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#2456a0" font-weight="700" text-anchor="middle">0</text>

<text x="456" y="381" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#50677d" font-weight="400" text-anchor="middle">0</text>
<text x="640" y="130" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#182d43" font-weight="700" text-anchor="start">集合 {0,2} → mask = 0101（二进制）</text>
<text x="708" y="190" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#50677d" font-weight="400" text-anchor="middle">地点 3</text>
<rect x="660" y="212" width="96" height="66" rx="9" fill="white" stroke="#cdd8e3"/>
<text x="708" y="257" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" fill="#50677d" font-weight="700" text-anchor="middle">0</text>
<text x="708" y="315" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#50677d" font-weight="400" text-anchor="middle">权值 8</text>
<text x="830" y="190" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#50677d" font-weight="400" text-anchor="middle">地点 2</text>
<rect x="782" y="212" width="96" height="66" rx="9" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="830" y="257" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" fill="#176244" font-weight="700" text-anchor="middle">1</text>
<text x="830" y="315" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#50677d" font-weight="400" text-anchor="middle">权值 4</text>
<text x="952" y="190" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#50677d" font-weight="400" text-anchor="middle">地点 1</text>
<rect x="904" y="212" width="96" height="66" rx="9" fill="white" stroke="#cdd8e3"/>
<text x="952" y="257" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" fill="#50677d" font-weight="700" text-anchor="middle">0</text>
<text x="952" y="315" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#50677d" font-weight="400" text-anchor="middle">权值 2</text>
<text x="1074" y="190" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#50677d" font-weight="400" text-anchor="middle">地点 0</text>
<rect x="1026" y="212" width="96" height="66" rx="9" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="1074" y="257" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="30" fill="#176244" font-weight="700" text-anchor="middle">1</text>
<text x="1074" y="315" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#50677d" font-weight="400" text-anchor="middle">权值 1</text>
<text x="650" y="372" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#176244" font-weight="700" text-anchor="start">0101 = 4 + 1 = 5，是集合编码。</text>
<text x="650" y="412" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#182d43" font-weight="400" text-anchor="start">已经选了 2 个地点，不是选了 5 个。</text>
<rect x="30" y="460" width="1180" height="92" rx="9" fill="#fff0d9" stroke="none"/>
<text x="50" y="497" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#a14b00" font-weight="700" text-anchor="start">集合不记录顺序：0→1→2 与 0→2→1 都对应 0111。</text>
<text x="50" y="533" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#182d43" font-weight="400" text-anchor="start">但末尾不同，下一条边的花费就可能不同，因此还需要 last。</text>
</svg>

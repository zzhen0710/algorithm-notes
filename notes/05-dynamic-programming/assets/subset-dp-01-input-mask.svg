<text x="192" y="237" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#50677d" font-weight="400" text-anchor="middle">0</text>
<rect x="236" y="205" width="88" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="280" y="237" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#182d43" font-weight="400" text-anchor="middle">1</text>

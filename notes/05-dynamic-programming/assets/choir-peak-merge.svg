<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title desc">
<title id="title">合唱队形：围绕同一个峰值组合</title>
<desc id="desc">原身高150、170、160、180、170、150，选下标3作为峰。左侧上升长度3，右侧下降长度3，都包含下标3，所以保留3加3减1等于5人，删除1人。</desc>
<rect width="1120" height="480" rx="18" fill="#f8fafc"/>

<text x="560" y="38" text-anchor="middle" font-size="25" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">固定同一个峰值位置，两个方向各自求最优</text>
<text x="180" y="76" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 0</text>
<rect x="126" y="91" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="180" y="120" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">150</text>
<rect x="126" y="154" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="180" y="183" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">1</text>
<rect x="126" y="217" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="180" y="246" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">1</text>
<text x="349" y="76" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 1</text>
<rect x="295" y="91" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="349" y="120" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">170</text>
<rect x="295" y="154" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="349" y="183" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">2</text>
<rect x="295" y="217" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="349" y="246" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3</text>
<text x="518" y="76" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 2</text>
<rect x="464" y="91" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="518" y="120" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">160</text>
<rect x="464" y="154" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="518" y="183" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">2</text>
<rect x="464" y="217" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="518" y="246" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">2</text>
<text x="687" y="76" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 3</text>
<rect x="633" y="91" width="108" height="42" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="687" y="120" text-anchor="middle" font-size="21" fill="#6d28d9" font-weight="bold" font-family="Microsoft YaHei,sans-serif">180</text>
<rect x="633" y="154" width="108" height="42" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="687" y="183" text-anchor="middle" font-size="21" fill="#6d28d9" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3</text>
<rect x="633" y="217" width="108" height="42" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
<text x="687" y="246" text-anchor="middle" font-size="21" fill="#6d28d9" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3</text>
<text x="856" y="76" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 4</text>
<rect x="802" y="91" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="856" y="120" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">170</text>
<rect x="802" y="154" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="856" y="183" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3</text>
<rect x="802" y="217" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="856" y="246" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">2</text>
<text x="1025" y="76" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 5</text>
<rect x="971" y="91" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="1025" y="120" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">150</text>
<rect x="971" y="154" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="1025" y="183" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">1</text>
<rect x="971" y="217" width="108" height="42" rx="8" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="1025" y="246" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">1</text>
<text x="62" y="120" text-anchor="middle" font-size="18" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">a[i]</text>
<text x="62" y="183" text-anchor="middle" font-size="18" fill="#0369a1" font-weight="bold" font-family="Microsoft YaHei,sans-serif">aes[i]</text>
<text x="62" y="246" text-anchor="middle" font-size="18" fill="#15803d" font-weight="bold" font-family="Microsoft YaHei,sans-serif">des[i]</text>
<text x="560" y="305" text-anchor="middle" font-size="23" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">左侧：150 → 170 → 180     右侧：180 → 170 → 150</text>
<text x="560" y="346" text-anchor="middle" font-size="21" fill="#6d28d9" font-weight="bold" font-family="Microsoft YaHei,sans-serif">两次出现的 180 是同一个人（下标 3），合并只保留一次</text>
<text x="560" y="398" text-anchor="middle" font-size="26" fill="#15803d" font-weight="bold" font-family="Microsoft YaHei,sans-serif">最多保留 = 3 + 3 − 1 = 5</text>
<text x="560" y="443" text-anchor="middle" font-size="20" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">最少出列 = 6 − 5 = 1；左右相同身高的其他人无需去重</text>
</svg>

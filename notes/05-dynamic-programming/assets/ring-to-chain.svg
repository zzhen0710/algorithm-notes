<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
<title id="title">破环成链：复制数组并枚举长度为 n 的窗口</title><desc id="desc">环为3、2、4，复制为3、2、4、3、2、4；起点0、1、2对应三个长度3的连续窗口。</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#95a5b8"/></marker></defs>
<rect width="1120" height="650" rx="18" fill="#f5f7fb"/>
<g font-family="Microsoft YaHei, sans-serif" fill="#1c2b40">
<text x="32" y="45" font-size="27" font-weight="700" fill="#1c2b40" text-anchor="start">破环成链：复制的是表示，每份原数据仍只使用一次</text>
<text x="32" y="82" font-size="21" font-weight="400" fill="#52677e" text-anchor="start">例：n = 3，环上顺序为 3 → 2 → 4 → 3。</text>
<line x1="120" y1="156" x2="229" y2="300" stroke="#8da1b8" stroke-width="2"/>
<line x1="229" y1="300" x2="55" y2="300" stroke="#8da1b8" stroke-width="2"/>
<line x1="55" y1="300" x2="120" y2="156" stroke="#8da1b8" stroke-width="2"/>
<circle cx="120" cy="156" r="28" fill="#e2edf9" stroke="#8ba9cc"/>
<text x="120" y="165" font-size="26" font-weight="700" fill="#1c2b40" text-anchor="middle">3</text>
<circle cx="229" cy="300" r="28" fill="#e2edf9" stroke="#8ba9cc"/>
<text x="229" y="309" font-size="26" font-weight="700" fill="#1c2b40" text-anchor="middle">2</text>
<circle cx="55" cy="300" r="28" fill="#e2edf9" stroke="#8ba9cc"/>
<text x="55" y="309" font-size="26" font-weight="700" fill="#1c2b40" text-anchor="middle">4</text>
<text x="32" y="375" font-size="20" font-weight="400" fill="#1c2b40" text-anchor="start">切口改变线性起点，</text>
<text x="32" y="408" font-size="20" font-weight="400" fill="#1c2b40" text-anchor="start">环上的先后顺序不变。</text>
<text x="401" y="137" font-size="18" font-weight="400" fill="#52677e" text-anchor="middle">0</text>
<rect x="354" y="154" width="94" height="62" rx="9" fill="#e5f1eb" stroke="#c6d3e2"/>
<text x="401" y="196" font-size="29" font-weight="700" fill="#1c2b40" text-anchor="middle">3</text>
<text x="509" y="137" font-size="18" font-weight="400" fill="#52677e" text-anchor="middle">1</text>
<rect x="462" y="154" width="94" height="62" rx="9" fill="#e5f1eb" stroke="#c6d3e2"/>
<text x="509" y="196" font-size="29" font-weight="700" fill="#1c2b40" text-anchor="middle">2</text>
<text x="617" y="137" font-size="18" font-weight="400" fill="#52677e" text-anchor="middle">2</text>
<rect x="570" y="154" width="94" height="62" rx="9" fill="#e5f1eb" stroke="#c6d3e2"/>
<text x="617" y="196" font-size="29" font-weight="700" fill="#1c2b40" text-anchor="middle">4</text>
<text x="725" y="137" font-size="18" font-weight="400" fill="#52677e" text-anchor="middle">3</text>
<rect x="678" y="154" width="94" height="62" rx="9" fill="#eef1f7" stroke="#c6d3e2"/>
<text x="725" y="196" font-size="29" font-weight="700" fill="#1c2b40" text-anchor="middle">3</text>
<text x="833" y="137" font-size="18" font-weight="400" fill="#52677e" text-anchor="middle">4</text>
<rect x="786" y="154" width="94" height="62" rx="9" fill="#eef1f7" stroke="#c6d3e2"/>
<text x="833" y="196" font-size="29" font-weight="700" fill="#1c2b40" text-anchor="middle">2</text>
<text x="941" y="137" font-size="18" font-weight="400" fill="#52677e" text-anchor="middle">5</text>
<rect x="894" y="154" width="94" height="62" rx="9" fill="#eef1f7" stroke="#c6d3e2"/>
<text x="941" y="196" font-size="29" font-weight="700" fill="#1c2b40" text-anchor="middle">4</text>
<text x="354" y="252" font-size="21" font-weight="700" fill="#176047" text-anchor="start">原数组</text>
<text x="678" y="252" font-size="21" font-weight="700" fill="#52677e" text-anchor="start">复制的一份</text>
<line x1="671" y1="120" x2="671" y2="272" stroke="#95a5b8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="354" y="344" font-size="21" font-weight="700" fill="#1c2b40" text-anchor="start">l = 0</text>
<rect x="438" y="310" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="468" y="343" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">3</text>
<rect x="510" y="310" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="540" y="343" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">2</text>
<rect x="582" y="310" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="612" y="343" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">4</text>
<text x="684" y="343" font-size="21" font-weight="400" fill="#1c2b40" text-anchor="start">窗口 [0,2]，恰好 3 项</text>
<text x="354" y="413" font-size="21" font-weight="700" fill="#1c2b40" text-anchor="start">l = 1</text>
<rect x="438" y="379" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="468" y="412" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">2</text>
<rect x="510" y="379" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="540" y="412" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">4</text>
<rect x="582" y="379" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="612" y="412" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">3</text>
<text x="684" y="412" font-size="21" font-weight="400" fill="#1c2b40" text-anchor="start">窗口 [1,3]，恰好 3 项</text>
<text x="354" y="482" font-size="21" font-weight="700" fill="#1c2b40" text-anchor="start">l = 2</text>
<rect x="438" y="448" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="468" y="481" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">4</text>
<rect x="510" y="448" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="540" y="481" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">3</text>
<rect x="582" y="448" width="61" height="48" rx="9" fill="#e4f3eb" stroke="#c6d3e2"/>
<text x="612" y="481" font-size="23" font-weight="700" fill="#1c2b40" text-anchor="middle">2</text>
<text x="684" y="481" font-size="21" font-weight="400" fill="#1c2b40" text-anchor="start">窗口 [2,4]，恰好 3 项</text>
<rect x="32" y="550" width="1056" height="66" rx="9" fill="#e5ebf5" stroke="#c6d3e2"/>
<text x="53" y="591" font-size="22" font-weight="700" fill="#1c2b40" text-anchor="start">枚举 0 ≤ l &lt; n；只处理 len ≤ n；对 [l, l+n−1] 的答案取最小／最大。</text>
</g>
</svg>

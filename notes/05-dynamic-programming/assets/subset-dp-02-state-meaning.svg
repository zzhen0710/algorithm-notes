<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" role="img"><title>为什么只记集合，或只记末尾，都不够？</title><desc>同一张花费表；只有 mask 和末尾都相同，未来能做的选择与追加花费才相同。</desc>
<rect x="0" y="0" width="1240" height="790" rx="0" fill="#f6f8fc" stroke="none"/>
<text x="30" y="43" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="28" fill="#182d43" font-weight="700" text-anchor="start">为什么只记集合，或只记末尾，都不够？</text>
<text x="30" y="80" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#50677d" font-weight="400" text-anchor="start">同一张花费表；只有 mask 和末尾都相同，未来能做的选择与追加花费才相同。</text>
<rect x="25" y="108" width="1190" height="290" rx="9" fill="white" stroke="#cdd8e3"/>
<text x="45" y="147" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="700" text-anchor="start">① 末尾都是 2，但已经访问的集合不同</text>
<rect x="30" y="172" width="280" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="45" y="204" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">路线</text>
<rect x="310" y="172" width="300" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="325" y="204" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">mask / 末尾</text>
<rect x="610" y="172" width="220" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="625" y="204" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">当前花费</text>
<rect x="830" y="172" width="380" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="845" y="204" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">还可以选择</text>
<rect x="30" y="220" width="280" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="45" y="252" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">0→2</text>
<rect x="310" y="220" width="300" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="325" y="252" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">0101 / 2</text>
<rect x="610" y="220" width="220" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="625" y="252" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">4</text>
<rect x="830" y="220" width="380" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="845" y="252" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">{1,3}</text>
<rect x="30" y="268" width="280" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="45" y="300" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">0→1→2</text>
<rect x="310" y="268" width="300" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="325" y="300" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">0111 / 2</text>
<rect x="610" y="268" width="220" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="625" y="300" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">3</text>
<rect x="830" y="268" width="380" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="845" y="300" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">{3}</text>
<text x="45" y="365" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#b33838" font-weight="700" text-anchor="start">不能合并：地点 1 是否还允许再选，取决于 mask。</text>
<rect x="25" y="419" width="1190" height="335" rx="9" fill="white" stroke="#cdd8e3"/>
<text x="45" y="460" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="700" text-anchor="start">② 集合都是 0111，但末尾不同，追加到地点 3 的花费不同</text>
<rect x="30" y="485" width="360" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="45" y="517" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">路线 / 末尾</text>
<rect x="390" y="485" width="200" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="405" y="517" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">前段花费</text>
<rect x="590" y="485" width="300" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="605" y="517" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">追加一条边</text>
<rect x="890" y="485" width="320" height="48" rx="0" fill="#e4efff" stroke="#cdd8e3"/>
<text x="905" y="517" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#2456a0" font-weight="700" text-anchor="start">完整花费</text>
<rect x="30" y="533" width="360" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="45" y="565" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">0→1→2 / 2</text>
<rect x="390" y="533" width="200" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="405" y="565" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">3</text>
<rect x="590" y="533" width="300" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="605" y="565" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">w[2][3] = 8</text>
<rect x="890" y="533" width="320" height="48" rx="0" fill="white" stroke="#cdd8e3"/>
<text x="905" y="565" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">3 + 8 = 11</text>
<rect x="30" y="581" width="360" height="48" rx="0" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="45" y="613" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">0→2→1 / 1</text>
<rect x="390" y="581" width="200" height="48" rx="0" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="405" y="613" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">7</text>
<rect x="590" y="581" width="300" height="48" rx="0" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="605" y="613" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">w[1][3] = 1</text>
<rect x="890" y="581" width="320" height="48" rx="0" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="905" y="613" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="20" fill="#182d43" font-weight="400" text-anchor="start">7 + 1 = 8</text>
<text x="45" y="715" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#176244" font-weight="700" text-anchor="start">前段更贵的 7，完成后反而得到更小的 8；只按 mask 留 3 会丢掉最优解。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="490" viewBox="0 0 1120 490" role="img" aria-labelledby="title desc">
<title id="title">以当前位置结尾的LIS状态</title>
<desc id="desc">数组1、2、100、3、4的下标为0到4，对应dp为1、2、3、3、4。处理下标4时，前驱100不合法，前驱3提供最长候选4。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#64748b"/></marker></defs>
<rect width="1120" height="490" rx="18" fill="#f8fafc"/>

<text x="560" y="39" text-anchor="middle" font-size="25" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">固定当前结尾，再比较所有合法前驱</text>
<text x="55" y="118" text-anchor="middle" font-size="19" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">a[i]</text>
<text x="55" y="185" text-anchor="middle" font-size="19" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">dp[i]</text>
<text x="150" y="77" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 0</text>
<rect x="91" y="91" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="150" y="120" text-anchor="middle" font-size="22" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">1</text>
<rect x="91" y="157" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="150" y="187" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">1</text>
<text x="355" y="77" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 1</text>
<rect x="296" y="91" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="355" y="120" text-anchor="middle" font-size="22" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">2</text>
<rect x="296" y="157" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="355" y="187" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">2</text>
<text x="560" y="77" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 2</text>
<rect x="501" y="91" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="560" y="120" text-anchor="middle" font-size="22" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">100</text>
<rect x="501" y="157" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="560" y="187" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3</text>
<text x="765" y="77" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 3</text>
<rect x="706" y="91" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="765" y="120" text-anchor="middle" font-size="22" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3</text>
<rect x="706" y="157" width="118" height="44" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="765" y="187" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3</text>
<text x="970" y="77" text-anchor="middle" font-size="17" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">i = 4</text>
<rect x="911" y="91" width="118" height="44" rx="10" fill="#dbeafe" stroke="#cbd5e1" stroke-width="2"/>
<text x="970" y="120" text-anchor="middle" font-size="22" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">4</text>
<rect x="911" y="157" width="118" height="44" rx="10" fill="#dcfce7" stroke="#cbd5e1" stroke-width="2"/>
<text x="970" y="187" text-anchor="middle" font-size="21" fill="#15803d" font-weight="bold" font-family="Microsoft YaHei,sans-serif">4</text>
<text x="560" y="246" text-anchor="middle" font-size="21" fill="#334155" font-weight="bold" font-family="Microsoft YaHei,sans-serif">当前 i = 4，必须以 a[4] = 4 结尾</text>
<rect x="35" y="273" width="245" height="91" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="157" y="300" text-anchor="middle" font-size="18" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">j = 0：1 &lt; 4</text>
<text x="157" y="336" text-anchor="middle" font-size="20" fill="#64748b" font-weight="bold" font-family="Microsoft YaHei,sans-serif">1 + 1 = 2</text>
<path d="M157 366 L560 412" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" fill="none"/>
<rect x="310" y="273" width="245" height="91" rx="10" fill="white" stroke="#cbd5e1" stroke-width="2"/>
<text x="432" y="300" text-anchor="middle" font-size="18" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">j = 1：2 &lt; 4</text>
<text x="432" y="336" text-anchor="middle" font-size="20" fill="#64748b" font-weight="bold" font-family="Microsoft YaHei,sans-serif">2 + 1 = 3</text>
<path d="M432 366 L560 412" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" fill="none"/>
<rect x="585" y="273" width="245" height="91" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
<text x="707" y="300" text-anchor="middle" font-size="18" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">j = 2：100 ≥ 4</text>
<text x="707" y="336" text-anchor="middle" font-size="20" fill="#64748b" font-weight="bold" font-family="Microsoft YaHei,sans-serif">不能接入</text>
<rect x="860" y="273" width="245" height="91" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="982" y="300" text-anchor="middle" font-size="18" fill="#334155" font-weight="normal" font-family="Microsoft YaHei,sans-serif">j = 3：3 &lt; 4</text>
<text x="982" y="336" text-anchor="middle" font-size="20" fill="#15803d" font-weight="bold" font-family="Microsoft YaHei,sans-serif">3 + 1 = 4</text>
<path d="M982 366 L560 412" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" fill="none"/>
<text x="560" y="451" text-anchor="middle" font-size="24" fill="#15803d" font-weight="bold" font-family="Microsoft YaHei,sans-serif">dp[4] = max(1, 2, 3, 4) = 4</text>
</svg>

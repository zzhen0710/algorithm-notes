<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" role="img"><title>执行 2：得到六个“恰好访问三个地点”的状态</title><desc>图按已选数量分层展示；代码仍按 mask 的整数值递增处理，所有来源下标都更小。</desc>

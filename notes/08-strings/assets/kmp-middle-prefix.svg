<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="760" viewBox="0 0 1140 760" role="img" aria-labelledby="title desc">
<title id="title">CF126B：内部出现的前缀形成长度上限，再沿全串 border 链筛选</title>
<desc id="desc">字符串 abcdabcdabcd 长度12。pi[10]=7，对应前缀abcdabc在内部下标4到10出现，最后一位11不参与mx。将内部这次出现从开头缩短到4个字符，得到下标4到7的abcd。全串border候选8超过mx7，回退到pi[7]=4后合法。缩短时保留的是开头，不是末尾dabc。</desc>
<rect x="0" y="0" width="1140" height="760" rx="0" fill="#f8fafc" stroke="#f8fafc"/>
<text x="32" y="46" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="30" fill="#172554" font-weight="700" text-anchor="start">mx 把“内部出现”变成一个长度上限</text>
<text x="32" y="81" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="start">s = abcdabcdabcd，n = 12；统计 pi[0..10]，排除最后一项 pi[11]。</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="770" viewBox="0 0 1160 770" role="img"><title>先保留外层，再把两个自由长度缩成两类候选</title><desc>原题示例 abcdfdcecba：保留可以安全固定的外层；中间两端不同，不能再两侧都取。</desc>

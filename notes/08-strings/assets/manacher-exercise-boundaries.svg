<text x="100" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">0</text>
<text x="100" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">#</text>
<rect x="151" y="289" width="58" height="47" rx="8" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="180" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">1</text>
<text x="180" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">d</text>
<rect x="231" y="289" width="58" height="47" rx="8" fill="#dff2e7" stroke="#cdd8e3"/>

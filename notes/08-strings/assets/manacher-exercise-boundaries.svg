<text x="500" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">5</text>
<text x="500" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">d</text>
<rect x="551" y="289" width="58" height="47" rx="8" fill="#dff2e7" stroke="#cdd8e3"/>
<text x="580" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">6</text>
<text x="580" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">#</text>
<rect x="631" y="289" width="58" height="47" rx="8" fill="white" stroke="#cdd8e3"/>
<text x="660" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">7</text>
<text x="660" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">c</text>
<rect x="711" y="289" width="58" height="47" rx="8" fill="#e4efff" stroke="#cdd8e3"/>
<text x="740" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">8</text>
<text x="740" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">#</text>
<rect x="791" y="289" width="58" height="47" rx="8" fill="#e4efff" stroke="#2456a0"/>
<text x="820" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">9</text>
<text x="820" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">e</text>
<rect x="871" y="289" width="58" height="47" rx="8" fill="#e4efff" stroke="#cdd8e3"/>
<text x="900" y="275" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="17" fill="#50677d" font-weight="400" text-anchor="middle">10</text>
<text x="900" y="321" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="24" fill="#182d43" font-weight="400" text-anchor="middle">#</text>
<line x1="100" y1="357" x2="580" y2="357" stroke="#176244" stroke-width="3"/>
<line x1="100" y1="352" x2="100" y2="362" stroke="#176244" stroke-width="2"/>
<line x1="580" y1="352" x2="580" y2="362" stroke="#176244" stroke-width="2"/>
<text x="340.0" y="385" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#176244" font-weight="400" text-anchor="middle">前缀 dfd：中心 i = 3，p[3] = 3</text>
<line x1="740" y1="406" x2="900" y2="406" stroke="#2456a0" stroke-width="3"/>
<line x1="740" y1="401" x2="740" y2="411" stroke="#2456a0" stroke-width="2"/>
<line x1="900" y1="401" x2="900" y2="411" stroke="#2456a0" stroke-width="2"/>
<text x="820.0" y="434" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#2456a0" font-weight="400" text-anchor="middle">后缀 e：i = 9，p[9] = 1</text>
<rect x="30" y="466" width="530" height="145" rx="8" fill="#dff2e7" stroke="#cdd8e3"/>
<rect x="600" y="466" width="530" height="145" rx="8" fill="#e4efff" stroke="#cdd8e3"/>
<text x="49" y="502" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#176244" font-weight="700" text-anchor="start">左端是 0，才是 mid 的前缀</text>
<text x="49" y="545" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#176244" font-weight="400" text-anchor="start">i − p[i] = 3 − 3 = 0</text>
<text x="49" y="584" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#176244" font-weight="700" text-anchor="start">所以筛选条件：p[i] == i</text>
<text x="619" y="502" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#2456a0" font-weight="700" text-anchor="start">右端是 2m，才是 mid 的后缀</text>
<text x="619" y="545" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#2456a0" font-weight="400" text-anchor="start">i + p[i] = 9 + 1 = 10 = 2m</text>
<text x="619" y="584" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#2456a0" font-weight="700" text-anchor="start">所以筛选条件：i + p[i] == 2 * m</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="655" viewBox="0 0 1160 655" role="img"><title>同一个半径表：看是否触及最左或最右分隔符</title><desc>此处只对 mid = dfdce 建表：m = 5；t 的下标为 0..10，不使用整串 s 的坐标。</desc>
<rect x="0" y="0" width="1160" height="655" rx="0" fill="#f6f8fc" stroke="none"/>
<text x="30" y="43" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="27" fill="#182d43" font-weight="700" text-anchor="start">同一个半径表：看是否触及最左或最右分隔符</text>
<text x="30" y="79" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="18" fill="#50677d" font-weight="400" text-anchor="start">此处只对 mid = dfdce 建表：m = 5；t 的下标为 0..10，不使用整串 s 的坐标。</text>
<text x="26" y="180" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#182d43" font-weight="700" text-anchor="start">mid</text>

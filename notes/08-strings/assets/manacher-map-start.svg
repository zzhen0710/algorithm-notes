<text x="405.0" y="433" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="19" fill="#a14b00" font-weight="400" text-anchor="middle">从中心 7 向左 5 格，到分隔符 2</text>
<text x="40" y="481" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#182d43" font-weight="700" text-anchor="start">① 左分隔符：i − p[i] = 7 − 5 = 2。</text>
<text x="40" y="524" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="23" fill="#2456a0" font-weight="400" text-anchor="start">② 它右边的第一个字符：t[3] ↔ s[1]。</text>
<text x="40" y="567" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="21" fill="#182d43" font-weight="400" text-anchor="start">③ s[start] 对应 t[2 × start + 1]，它前面的分隔符就是 t[2 × start]。</text>
<rect x="30" y="590" width="1140" height="62" rx="8" fill="#dff2e7" stroke="none"/>
<text x="52" y="630" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="25" fill="#176244" font-weight="700" text-anchor="start">2 × start = i − p[i]    ⇒    start = (7 − 5) / 2 = 1</text>
<text x="40" y="694" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="22" fill="#182d43" font-weight="700" text-anchor="start">长度为 p[7] = 5，所以取原串 s.substr(1, 5)，得到 aabaa。</text>

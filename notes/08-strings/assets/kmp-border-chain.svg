<text x="679" y="218" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">a</text>
<rect x="706" y="187" width="42" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="727" y="218" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">b</text>
<rect x="754" y="187" width="42" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="775" y="218" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">a</text>
<text x="945" y="218" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#b91c1c" font-weight="700" text-anchor="start">不相等</text>
<text x="93" y="286" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#166534" font-weight="700" text-anchor="middle">3</text>
<rect x="244" y="252" width="42" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>

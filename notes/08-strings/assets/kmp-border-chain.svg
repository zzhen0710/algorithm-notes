<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="790" viewBox="0 0 1100 790" role="img" aria-labelledby="title desc">
<title id="title">KMP 的合法回退候选：为什么不能直接 j--</title>
<desc id="desc">已匹配块 ababa：长度4的前缀abab不等于后缀baba，长度3的aba相等，长度2的ab不等于ba，长度1的a相等。回退依次查询 pi[4]、pi[2]、pi[0]，得到5到3到1到0；只有继续失配时才进入下一个候选。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<rect x="0" y="0" width="1100" height="790" rx="0" fill="#f8fafc"/>
<text x="32" y="47" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="31" fill="#172554" font-weight="700" text-anchor="start">为什么沿 5 → 3 → 1 → 0 回退？</text>
<text x="32" y="84" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="start">已匹配块是 ababa。可保留的部分，必须同时是模式前缀和已匹配块后缀。</text>
<rect x="24" y="112" width="1052" height="420" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
<text x="52" y="153" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#172554" font-weight="700" text-anchor="start">保留长度</text>
<text x="245" y="153" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#172554" font-weight="700" text-anchor="start">前缀</text>
<text x="610" y="153" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#172554" font-weight="700" text-anchor="start">后缀</text>
<text x="945" y="153" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#172554" font-weight="700" text-anchor="start">判断</text>
<line x1="46" y1="172" x2="1054" y2="172" stroke="#e2e8f0" stroke-width="2"/>
<text x="93" y="221" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">4</text>

<rect x="610" y="317" width="42" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="631" y="348" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">b</text>
<rect x="658" y="317" width="42" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="679" y="348" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">a</text>
<text x="945" y="348" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#b91c1c" font-weight="700" text-anchor="start">不相等</text>
<text x="93" y="416" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#166534" font-weight="700" text-anchor="middle">1</text>
<rect x="244" y="382" width="42" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="265" y="413" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#15803d" font-weight="700" text-anchor="middle">a</text>
<rect x="610" y="382" width="42" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="631" y="413" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#15803d" font-weight="700" text-anchor="middle">a</text>
<text x="945" y="413" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#166534" font-weight="700" text-anchor="start">可保留</text>
<text x="93" y="481" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#64748b" font-weight="700" text-anchor="middle">0</text>
<text x="244" y="477" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="24" fill="#64748b" font-weight="400" text-anchor="start">空</text>
<text x="610" y="477" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="24" fill="#64748b" font-weight="400" text-anchor="start">空</text>
<text x="945" y="478" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#64748b" font-weight="700" text-anchor="start">重新起步</text>
<text x="32" y="574" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="21" fill="#7f1d1d" font-weight="400" text-anchor="start">长度 4、2 的前后两段不相等，不能当作下一段已匹配前缀。</text>
<rect x="45" y="616" width="175" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="132.5" y="658" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#075985" font-weight="700" text-anchor="middle">j = 5</text>
<rect x="320" y="616" width="175" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="407.5" y="658" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#075985" font-weight="700" text-anchor="middle">j = 3</text>
<rect x="595" y="616" width="175" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="682.5" y="658" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#075985" font-weight="700" text-anchor="middle">j = 1</text>
<rect x="870" y="616" width="175" height="64" rx="10" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="957.5" y="658" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#075985" font-weight="700" text-anchor="middle">j = 0</text>
<line x1="230" y1="649" x2="308" y2="649" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="270.0" y="622" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">pi[4]</text>
<line x1="505" y1="649" x2="583" y2="649" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="545.0" y="622" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">pi[2]</text>
<line x1="780" y1="649" x2="858" y2="649" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="820.0" y="622" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="19" fill="#475569" font-weight="400" text-anchor="middle">pi[0]</text>
<text x="32" y="725" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#172554" font-weight="700" text-anchor="start">只有当前字符仍失配，才继续沿箭头下降；一旦匹配成功，立即停止回退。</text>
<text x="32" y="765" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#475569" font-weight="400" text-anchor="start">查 pi[j-1]：先用 j-1 定位当前块的末位，再读取它的最长 border 长度。</text>
</svg>

<text x="945" y="283" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',sans-serif" font-size="20" fill="#166534" font-weight="700" text-anchor="start">可保留</text>
<text x="93" y="351" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">2</text>
<rect x="244" y="317" width="42" height="44" rx="6" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/>
<text x="265" y="348" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#b91c1c" font-weight="700" text-anchor="middle">a</text>

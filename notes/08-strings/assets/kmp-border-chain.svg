<text x="361" y="283" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#15803d" font-weight="700" text-anchor="middle">a</text>
<rect x="610" y="252" width="42" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="631" y="283" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#15803d" font-weight="700" text-anchor="middle">a</text>
<rect x="658" y="252" width="42" height="44" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1"/>
<text x="679" y="283" font-family="'Consolas','DejaVu Sans Mono',monospace" font-size="27" fill="#15803d" font-weight="700" text-anchor="middle">b</text>
